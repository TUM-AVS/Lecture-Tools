  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

  <script type="__bundler/template">
"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"b9667cfc-d17a-47c2-94c6-4d6df0b89e44\"><\u002Fscript>\n\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n  <meta name=\"design_doc_mode\" content=\"canvas\">\n  <style>\n    body { margin: 0; background: oklch(97% 0.004 250); }\n    @keyframes flowBlip {\n      0% { opacity: 0; transform: scale(0.3); }\n      18% { opacity: 1; transform: scale(1); }\n      100% { opacity: 0; transform: scale(0.85); }\n    }\n    @keyframes stackFlash {\n      0% { box-shadow: 0 0 0 0 oklch(60% 0.15 185 / 0.6); }\n      100% { box-shadow: 0 0 0 12px oklch(60% 0.15 185 / 0); }\n    }\n    @keyframes stackPulse {\n      0% { box-shadow: 0 0 0 0 oklch(55% 0.16 255 / 0.45); }\n      70% { box-shadow: 0 0 0 9px oklch(55% 0.16 255 / 0); }\n      100% { box-shadow: 0 0 0 0 oklch(55% 0.16 255 / 0); }\n    }\n  <\u002Fstyle>\n<\u002Fhelmet>\n<section style=\"display:flex;flex-direction:column;gap:18px;padding:32px 40px 48px;background:oklch(97% 0.004 250);min-height:100vh;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;color:oklch(22% 0.01 255);width:1340px\">\n\n  <div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:32px\">\n    <div style=\"display:flex;flex-direction:column;gap:5px;max-width:760px\">\n      <h1 style=\"margin:0;font-size:23px;font-weight:700;letter-spacing:-0.01em\">Autonomes Fahren – Interaktives Lernmodul<\u002Fh1>\n      <p style=\"margin:0;font-size:13.5px;line-height:1.5;color:oklch(48% 0.01 255)\">Links stellst du ein, in der Mitte fährt das Fahrzeug, rechts siehst du, was die Software daraus macht. Klick in die Szene platziert Objekte.<\u002Fp>\n    <\u002Fdiv>\n    <button sc-camel-on-click=\"{{ toggleGlossary }}\" style=\"flex-shrink:0;font-size:12.5px;padding:8px 13px;border-radius:8px;cursor:pointer;font-family:inherit;background:#ffffff;border:1.5px solid oklch(87% 0.006 255);color:oklch(35% 0.01 255)\">{{ glossaryLabel }}<\u002Fbutton>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;align-items:center;gap:12px;flex-wrap:nowrap\">\n    <span style=\"font-size:11px;font-weight:600;color:oklch(45% 0.01 255);letter-spacing:0.04em;text-transform:uppercase;flex-shrink:0\">Szenarien<\u002Fspan>\n    <div style=\"display:flex;gap:8px;flex:1;min-width:0;flex-wrap:wrap\">\n      <sc-for list=\"{{ b.scenarioButtons }}\" as=\"sc\" hint-placeholder-count=\"7\">\n        <button sc-camel-on-click=\"{{ sc.choose }}\" title=\"{{ sc.hint }}\" style=\"flex:0 1 auto;white-space:nowrap;font-size:12.5px;font-weight:{{ sc.weight }};padding:8px 12px;border-radius:8px;cursor:pointer;font-family:inherit;background:{{ sc.bg }};border:1.5px solid {{ sc.border }};color:{{ sc.fg }}\">{{ sc.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ b.scenarioHint }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"display:flex;align-items:center;gap:9px;padding:9px 14px;border-radius:9px;background:oklch(95% 0.02 255);border:1px solid oklch(85% 0.03 255);margin-top:-8px\">\n      <span style=\"font-size:10px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;color:oklch(45% 0.08 255);flex-shrink:0\">Aktives Szenario<\u002Fspan>\n      <span style=\"font-size:12.5px;color:oklch(38% 0.04 255);line-height:1.4\">{{ b.scenarioHint }}<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ showGlossary }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px 24px;background:#ffffff;border:1px solid oklch(89% 0.008 255);border-radius:12px;padding:14px 16px\">\n      <sc-for list=\"{{ glossaryTerms }}\" as=\"g\" hint-placeholder-count=\"9\">\n        <div style=\"font-size:12.5px;line-height:1.4\">\n          <span style=\"font-weight:700;color:oklch(30% 0.01 255)\">{{ g.term }}: <\u002Fspan>\n          <span style=\"color:oklch(45% 0.01 255)\">{{ g.def }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <div style=\"display:flex;align-items:center;gap:18px;background:oklch(26% 0.02 255);border-radius:14px;padding:14px 20px\">\n    <div style=\"display:flex;gap:8px;flex-shrink:0\">\n      <button sc-camel-on-click=\"{{ b.togglePause }}\" style=\"font-size:12.5px;font-weight:600;padding:9px 16px;border-radius:8px;cursor:pointer;font-family:inherit;background:{{ b.pauseBg }};border:1.5px solid {{ b.pauseBorder }};color:{{ b.pauseFg }}\">{{ b.pauseLabel }}<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ b.singleStep }}\" style=\"font-size:12.5px;padding:9px 14px;border-radius:8px;cursor:pointer;font-family:inherit;background:oklch(34% 0.02 255);border:1.5px solid oklch(42% 0.02 255);color:oklch(92% 0.005 255)\">Einzelschritt<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ b.resetSim }}\" style=\"font-size:12.5px;padding:9px 14px;border-radius:8px;cursor:pointer;font-family:inherit;background:oklch(34% 0.02 255);border:1.5px solid oklch(42% 0.02 255);color:oklch(92% 0.005 255)\">Zurücksetzen<\u002Fbutton>\n      <div style=\"display:flex;gap:4px;align-items:center;margin-left:4px\">\n        <span style=\"font-size:9.5px;color:oklch(72% 0.01 255);text-transform:uppercase;letter-spacing:0.05em\">Tempo<\u002Fspan>\n        <sc-for list=\"{{ b.timeScaleButtons }}\" as=\"ts\" hint-placeholder-count=\"3\">\n          <button sc-camel-on-click=\"{{ ts.choose }}\" title=\"{{ ts.hint }}\" style=\"font-size:11.5px;font-weight:600;padding:7px 9px;border-radius:7px;cursor:pointer;font-family:inherit;background:{{ ts.bg }};border:1.5px solid {{ ts.border }};color:{{ ts.fg }}\">{{ ts.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:10px;min-width:250px\">\n      <span style=\"font-size:11px;color:oklch(72% 0.01 255);white-space:nowrap\">Soll-Tempo<\u002Fspan>\n      <input type=\"range\" min=\"15\" max=\"130\" value=\"{{ b.speed }}\" sc-camel-on-change=\"{{ b.setSpeedVal }}\" style=\"flex:1\">\n      <span style=\"font-size:12px;font-family:ui-monospace,monospace;color:#ffffff;width:56px;text-align:right\">{{ b.speed }} km/h<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"width:1px;height:34px;background:oklch(38% 0.02 255)\"><\u002Fdiv>\n    <div style=\"display:flex;gap:14px;flex:1;min-width:0\">\n      <div style=\"display:flex;flex-direction:column;gap:2px;min-width:66px\" title=\"{{ b.tipSpeed }}\">\n        <div style=\"display:flex;align-items:center;gap:4px\"><span style=\"font-size:9.5px;color:oklch(72% 0.01 255);text-transform:uppercase;letter-spacing:0.05em\">v ist<\u002Fspan><button sc-camel-on-click=\"{{ b.openTipSpeed }}\" title=\"Erklärung anzeigen\" style=\"all:unset;cursor:pointer;font-size:11px;line-height:1;color:oklch(80% 0.02 255);opacity:0.9\">ⓘ<\u002Fbutton><\u002Fdiv>\n        <span style=\"font-size:19px;font-family:ui-monospace,monospace;font-weight:700;color:#ffffff\">{{ b.curSpeed }}<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:2px;min-width:66px\" title=\"{{ b.tipTtc }}\">\n        <div style=\"display:flex;align-items:center;gap:4px\"><span style=\"font-size:9.5px;color:oklch(72% 0.01 255);text-transform:uppercase;letter-spacing:0.05em\">TTC<\u002Fspan><button sc-camel-on-click=\"{{ b.openTipTtc }}\" title=\"Erklärung anzeigen\" style=\"all:unset;cursor:pointer;font-size:11px;line-height:1;color:oklch(80% 0.02 255);opacity:0.9\">ⓘ<\u002Fbutton><\u002Fdiv>\n        <span style=\"font-size:19px;font-family:ui-monospace,monospace;font-weight:700;color:{{ b.ttcColor }}\">{{ b.ttcDisplay }}<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:2px;min-width:66px\" title=\"{{ b.tipQuer }}\">\n        <div style=\"display:flex;align-items:center;gap:4px\"><span style=\"font-size:9.5px;color:oklch(72% 0.01 255);text-transform:uppercase;letter-spacing:0.05em\">Querfehler<\u002Fspan><button sc-camel-on-click=\"{{ b.openTipQuer }}\" title=\"Erklärung anzeigen\" style=\"all:unset;cursor:pointer;font-size:11px;line-height:1;color:oklch(80% 0.02 255);opacity:0.9\">ⓘ<\u002Fbutton><\u002Fdiv>\n        <span style=\"font-size:19px;font-family:ui-monospace,monospace;font-weight:700;color:{{ b.qColor }}\">{{ b.querfehlerDisplay }}<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:3px;min-width:108px\" title=\"{{ b.tipSteer }}\">\n        <div style=\"display:flex;align-items:center;gap:4px\"><span style=\"font-size:9.5px;color:oklch(72% 0.01 255);text-transform:uppercase;letter-spacing:0.05em\">Stellgröße u<\u002Fspan><button sc-camel-on-click=\"{{ b.openTipSteer }}\" title=\"Erklärung anzeigen\" style=\"all:unset;cursor:pointer;font-size:11px;line-height:1;color:oklch(80% 0.02 255);opacity:0.9\">ⓘ<\u002Fbutton><\u002Fdiv>\n        <span style=\"font-size:19px;font-family:ui-monospace,monospace;font-weight:700;color:#ffffff\">{{ b.steerDisplay }}<\u002Fspan>\n        <div style=\"position:relative;height:8px;border-radius:4px;background:oklch(36% 0.02 255)\">\n          <div style=\"position:absolute;left:50%;top:-2px;width:1px;height:12px;background:oklch(58% 0.02 255)\"><\u002Fdiv>\n          <div style=\"position:absolute;top:-1px;left:{{ b.steerGaugeLeft }};width:10px;height:10px;border-radius:50%;background:{{ b.steerGaugeColor }}\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;justify-content:space-between\">\n          <span style=\"font-size:8.5px;color:oklch(62% 0.01 255)\">links<\u002Fspan>\n          <span style=\"font-size:8.5px;color:oklch(62% 0.01 255)\">rechts<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ tipTitle }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"display:flex;align-items:flex-start;gap:12px;padding:12px 16px;border-r   <div style=\"background:#ffffff;border:1px solid oklch(89% 0.008 255);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:7px\">\n        <span style=\"font-size:11px;font-weight:600;color:oklch(45% 0.01 255);letter-spacing:0.04em;text-transform:uppercase\">Software-Stack (live)<\u002Fspan>\n        <sc-for list=\"{{ b.stackBlocks }}\" as=\"blk\" hint-placeholder-count=\"6\">\n          <div style=\"display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;background:{{ blk.bg }};border:1.5px solid {{ blk.border }};animation:{{ blk.anim }}\">\n            <div style=\"width:8px;height:8px;border-radius:50%;background:{{ blk.dotColor }};flex-shrink:0\"><\u002Fdiv>\n            <span style=\"font-size:13px;font-weight:600;color:{{ blk.color }};flex-shrink:0\">{{ blk.label }}<\u002Fspan>\n            <div style=\"display:flex;align-items:center;justify-content:center;flex:1;min-width:26px;height:10px\">\n              <sc-if value=\"{{ blk.hasToken }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"width:10px;height:10px;border-radius:50%;background:{{ blk.tokenColor }};box-shadow:0 0 0 4px oklch(60% 0.15 255 / 0.18);animation:{{ blk.tokenAnim }}\"><\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n            <span style=\"font-size:11.5px;color:{{ blk.color }};opacity:0.9;flex-shrink:0\">{{ blk.status }}<\u002Fspan>\n            <span style=\"font-size:11px;font-weight:600;font-variant-numeric:tabular-nums;color:{{ blk.latencyColor }};width:46px;text-align:right;flex-shrink:0\">{{ blk.latencyText }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <div style=\"display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:2px\">\n          <sc-for list=\"{{ b.stackLegend }}\" as=\"lg\" hint-placeholder-count=\"5\">\n            <div style=\"display:flex;align-items:center;gap:5px\">\n              <div style=\"width:7px;height:7px;border-radius:50%;background:{{ lg.color }}\"><\u002Fdiv>\n              <span style=\"font-size:10.5px;color:oklch(52% 0.01 255)\">{{ lg.label }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"font-size:11.5px;color:oklch(50% 0.01 255);line-height:1.45;margin-top:2px\">{{ b.flowNote }} {{ b.latencyNote }}<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background:#ffffff;border:1px solid oklch(89% 0.008 255);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:11px;flex:1\">\n        <span style=\"font-size:11px;font-weight:600;color:oklch(45% 0.01 255);letter-spacing:0.04em;text-transform:uppercase\">Betriebsbereich (ODD)<\u002Fspan>\n        <div style=\"display:flex;align-items:center;gap:10px;padding:10px 13px;border-radius:9px;background:{{ b.oddBg }};border:1.5px solid {{ b.oddColor }}\">\n          <div style=\"width:9px;height:9px;border-radius:50%;background:{{ b.oddColor }};flex-shrink:0\"><\u002Fdiv>\n          <span style=\"font-size:13px;font-weight:600;color:{{ b.oddColor }};line-height:1.35\">{{ b.oddText }}<\u002Fspan>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-size:10px;color:oklch(45% 0.01 255);text-transform:uppercase;letter-spacing:0.04em;margin-bottom:5px\">Querfehler-Verlauf<\u002Fdiv>\n          <svg sc-camel-view-box=\"0 -22 150 44\" width=\"100%\" height=\"50\">\n            <line x1=\"0\" y1=\"0\" x2=\"150\" y2=\"0\" stroke=\"oklch(85% 0.01 255)\" stroke-width=\"1\"><\u002Fline>\n            <polyline points=\"{{ b.histPts }}\" fill=\"none\" stroke=\"oklch(48% 0.14 255)\" stroke-width=\"1.5\"><\u002Fpolyline>\n          <\u002Fsvg>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:7px;border-top:1px solid oklch(92% 0.006 255);padding-top:11px\">\n          <div style=\"font-size:10px;color:oklch(45% 0.01 255);text-transform:uppercase;letter-spacing:0.04em\">Legende der Szene<\u002Fdiv>\n          <sc-for list=\"{{ b.sceneLegend }}\" as=\"lg\" hint-placeholder-count=\"6\">\n            <div style=\"display:flex;align-items:flex-start;gap:9px;line-height:1.4\">\n              <svg sc-camel-view-box=\"0 0 18 18\" width=\"18\" height=\"18\" style=\"flex-shrink:0;margin-top:2px;display:block\">\n                <sc-if value=\"{{ lg.isCone }}\" hint-placeholder-val=\"{{ false }}\">\n                  <polygon points=\"9,17 2,2 16,2\" fill=\"{{ lg.fill }}\" stroke=\"{{ lg.stroke }}\" stroke-width=\"1.3\"><\u002Fpolygon>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ lg.isRing }}\" hint-placeholder-val=\"{{ false }}\">\n                  <circle cx=\"9\" cy=\"9\" r=\"7\" fill=\"{{ lg.fill }}\" stroke=\"{{ lg.stroke }}\" stroke-width=\"1.3\"><\u002Fcircle>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ lg.isBar }}\" hint-placeholder-val=\"{{ false }}\">\n                  <rect x=\"5\" y=\"1\" width=\"8\" height=\"16\" rx=\"2\" fill=\"{{ lg.fill }}\" opacity=\"0.25\"><\u002Frect>\n                  <line x1=\"4\" y1=\"2\" x2=\"14\" y2=\"2\" stroke=\"{{ lg.stroke }}\" stroke-width=\"1.8\"><\u002Fline>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ lg.isDash }}\" hint-placeholder-val=\"{{ false }}\">\n                  <line x1=\"9\" y1=\"17\" x2=\"9\" y2=\"1\" stroke=\"{{ lg.stroke }}\" stroke-width=\"2\" stroke-dasharray=\"3,3\"><\u002Fline>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ lg.isSign }}\" hint-placeholder-val=\"{{ false }}\">\n                  <circle cx=\"9\" cy=\"9\" r=\"7\" fill=\"{{ lg.fill }}\" stroke=\"{{ lg.stroke }}\" stroke-width=\"2.4\"><\u002Fcircle>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ lg.isCam }}\" hint-placeholder-val=\"{{ false }}\">\n                  <rect x=\"3\" y=\"4\" width=\"12\" height=\"8\" rx=\"2\" fill=\"{{ lg.fill }}\" stroke=\"{{ lg.stroke }}\" stroke-width=\"1.2\"><\u002Frect>\n                  <line x1=\"9\" y1=\"12\" x2=\"9\" y2=\"17\" stroke=\"{{ lg.stroke }}\" stroke-width=\"1.6\"><\u002Fline>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ lg.isZone }}\" hint-placeholder-val=\"{{ false }}\">\n                  <rect x=\"2\" y=\"2\" width=\"14\" height=\"14\" rx=\"2.5\" fill=\"{{ lg.fill }}\" stroke=\"{{ lg.stroke }}\" stroke-width=\"1.5\" stroke-dasharray=\"3,2.5\"><\u002Frect>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ lg.isBox }}\" hint-placeholder-val=\"{{ false }}\">\n                  <rect x=\"3.5\" y=\"1.5\" width=\"11\" height=\"15\" rx=\"2\" fill=\"{{ lg.fill }}\" stroke=\"{{ lg.stroke }}\" stroke-width=\"2.5\"><\u002Frect>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ lg.isArrow }}\" hint-placeholder-val=\"{{ false }}\">\n                  <rect x=\"1\" y=\"1\" width=\"16\" height=\"16\" rx=\"2\" fill=\"oklch(45% 0.01 255)\"><\u002Frect>\n                  <polygon points=\"9,3 4,11 14,11\" fill=\"{{ lg.fill }}\"><\u002Fpolygon>\n                  <rect x=\"7.5\" y=\"10\" width=\"3\" height=\"4\" fill=\"{{ lg.fill }}\"><\u002Frect>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ lg.isLight }}\" hint-placeholder-val=\"{{ false }}\">\n                  <rect x=\"5\" y=\"1\" width=\"8\" height=\"12\" rx=\"2\" fill=\"{{ lg.stroke }}\"><\u002Frect>\n                  <circle cx=\"9\" cy=\"4.5\" r=\"2\" fill=\"{{ lg.fill }}\"><\u002Fcircle>\n                  <line x1=\"2\" y1=\"16\" x2=\"16\" y2=\"16\" stroke=\"#ffffff\" stroke-width=\"2\"><\u002Fline>\n                  <line x1=\"2\" y1=\"16\" x2=\"16\" y2=\"16\" stroke=\"{{ lg.stroke }}\" stroke-width=\"1\" stroke-dasharray=\"2,2\"><\u002Fline>\n                <\u002Fsc-if>\n              <\u002Fsvg>\n              <div style=\"flex:1;min-width:0;line-height:1.4\">\n                <span style=\"font-size:12px;font-weight:600;color:oklch(32% 0.01 255)\">{{ lg.label }} <\u002Fspan>\n                <span style=\"font-size:11.5px;color:oklch(50% 0.01 255)\">– {{ lg.desc }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst SENSOR_DEFS = [\n  { key: 'camera', label: 'Kamera', role: 'Klassifikation & Ampelfarbe', lost: 'Ampelfarbe und Objektklasse unbekannt → keine Prädiktion, nur Nothalt' },\n  { key: 'lidar', label: 'Lidar', role: 'Exakte Distanz & Geometrie', lost: 'Distanz nur geschätzt → späterer Bremsbeginn' },\n  { key: 'radar', label: 'Radar', role: 'Relativgeschwindigkeit, vorn und Heckbereich', lost: 'Keine Prädiktion bewegter Objekte' },\n];\nconst OBJ_TYPES = [\n  { key: 'vehicle', label: 'Fahrzeug' },\n  { key: 'fussgaenger', label: 'Fußgänger' },\n  { key: 'parkfahrzeug', label: 'Parkendes Fzg.' },\n  { key: 'hindernis', label: 'Hindernis' },\n];\n// Typische Verarbeitungszeiten je Stufe (ms). Summe = Reaktionszeit der Software, die bei hohem\n// Tempo in Strecke umgerechnet erklärt, warum auch korrekte Erkennung zu spät sein kann.\nconst TIP_TEXTS = {\n  \"speed\": [\n    \"v ist — Ist-Geschwindigkeit\",\n    \"Aktuelle Geschwindigkeit in km/h. Sie folgt der Sollvorgabe über die Längsregelung; die maximale Verzögerung ist a = μ · g, hängt also am Fahrbahnzustand.\"\n  ],\n  \"ttc\": [\n    \"TTC — Time to Collision\",\n    \"TTC = Abstand / Relativgeschwindigkeit, Einheit Sekunden. Gibt an, wie lange es bei unverändertem Verlauf bis zur Kollision dauert. Unter 2 s gilt die Situation als kritisch.\"\n  ],\n  \"quer\": [\n    \"Querfehler e — Regelfehler der Querregelung\",\n    \"e = x_soll − x_ist, Einheit Meter. Seitlicher Abstand zwischen geplantem Pfad und Fahrzeugmitte. 0 bedeutet, dass das Fahrzeug genau auf dem Pfad liegt — auch dann, wenn der Pfad selbst einen gewollten Spur-Offset hat (Spurwechsel, Ideallinie, Ausweichbogen).\"\n  ],\n  \"steer\": [\n    \"Stellgröße u — Ausgang des P-Reglers\",\n    \"Begriffe: die Regelgröße ist die geregelte Größe, hier der Querfehler e; u ist die Stellgröße, mit der der Regler auf sie einwirkt. u = Kp · e mit Kp = 2,4 und e in Pixeln; bei e in Metern entspricht das u = 96 · e. Quer gilt durchgehend 1 m = 40 px; der Längsmaßstab der Szene ist szenarioabhängig. Ergebnis ist die seitliche Korrekturrate in px/s, im Betrag auf ±90 px/s und in der Änderungsrate auf 260 px/s² begrenzt — diese Lenkdynamik ist der Grund, warum u bei großem e in die Begrenzung läuft, statt weiter proportional zu wachsen. Der Zeiger zeigt die Auslastung: links vom Mittelstrich lenkt nach links, rechts nach rechts.\"\n  ]\n};\nconst SCENARIO_DEFS = [\n  { key: 'blindLight', label: 'Blindes Rotlicht', hint: 'Prüft, was passiert, wenn die Kamera ausfällt und die Ampelfarbe niemand mehr lesen kann.' },\n  { key: 'sensorFail80', label: 'Sensorausfall bei Tempo 80', hint: 'Kompletter Sensorausfall bei hohem Tempo: zeigt, wie weit das Fahrzeug blind weiterfährt.' },\n  { key: 'curve', label: 'Kurvenfahrt', hint: 'Pfadplanung erkennt die Krümmung voraus und senkt die Sollgeschwindigkeit vor der Kurve.' },\n  { key: 'occludedPed', label: 'Verdeckter Fußgänger', hint: 'Ein parkendes Fahrzeug verdeckt die Sichtlinie — physische Verdeckung, gegen die keine Sensor-Redundanz hilft.' },\n  { key: 'crossing', label: 'Kreuzung ohne Ampel', hint: 'Stoppschild und Vorfahrt: die Kamera muss das Schild lesen, dann hält das Fahrzeug und fährt erst los, wenn von rechts nichts kommt.' },\n  { key: 'laneChange', label: 'Spurwechsel', hint: 'Schnellerer Verkehr auf der Überholspur: eine Lücke abwarten. Der tote Winkel neben dem Fahrzeug wird nur vom Lidar abgedeckt, Kamera und Radar schauen nach vorn.' },\n  { key: 'speedLimit', label: 'Tempolimits & Blitzer', hint: 'Verkehrszeichenerkennung: 30 → 70 → 50, dazwischen zwei Blitzer. Nur die Kamera liest Schilder — ohne sie bleibt der Sollwert stehen und der Verstoß wird gemessen.' },\n  { key: 'overtake', label: 'Überholen mit Gegenverkehr', hint: 'Landstraße: die Planung muss abschätzen, ob die Lücke im Gegenverkehr für den Überholweg reicht. Ohne Radar fehlt die Relativgeschwindigkeit — die Schätzung fällt zu optimistisch aus.' },\n];\nconst TIME_SCALES = [\n  { val: 0.25, label: '0,25×', hint: 'Viertel-Tempo — für Frame-genaues Beobachten' },\n  { val: 0.5, label: '0,5×', hint: 'Halbes Tempo — empfohlen für Überholen und Kreuzung' },\n  { val: 1, label: '1×', hint: 'Echtzeit' },\n];\nconst STACK_DEFS = [\n  { key: 'sensorik', label: 'Sensorik', latency: 33 },\n  { key: 'perzeption', label: 'Perzeption', latency: 45 },\n  { key: 'tracking', label: 'Tracking', latency: 12 },\n  { key: 'praediktion', label: 'Prädiktion', latency: 18 },\n  { key: 'planung', label: 'Planung', latency: 25 },\n  { key: 'regelung', label: 'Regelung', latency: 15 },\n];\n\nconst LANE_LEFT = 60, LANE_RIGHT = 260, LANE_CENTER = 160, EGO_Y = 520, PX_PER_M = 40, MAX_STEER = 90;\nconst LANE_LEFT_CENTER = 110, LANE_RIGHT_CENTER = 210;\n// Tempozuschlag beim Überholen. Die Mindestlücke nach hinten wird nicht pauschal gesetzt,\n// sondern in laneGapCheck aus der Beschleunigungsstrecke berechnet.\nconst LANE_BOOST_KMH = 35;\n// Mindest-Seitenabstand beim Vorbeifahren. Kollidiert wird ab 26 px Querabstand; 34 px lässt\n// knapp 0,2 m Reserve. Darunter gilt ein Ausweichmanöver als nicht durchführbar.\nconst SAFE_CLEAR = 34;\n// Längsdynamik in echten Einheiten. 5,0 m/s² ist eine kräftige, aber komfortable Betriebsbremsung\n// auf trockener Fahrbahn (Vollbremsung läge bei 8–9); 3,0 m/s² ist zügiges Beschleunigen.\n// Standard-Längsmaßstab: 0.2 · 40 px/m = 8 px/m, die Szene zeigt damit 80 m.\nconst DEFAULT_LONG_SCALE = 0.2;\nconst DECEL_MS2 = 5.0;\nconst ACCEL_MS2 = 3.0;\n// Gefahren wird in der RECHTEN Spur. LANE_CENTER ist die gestrichelte Trennlinie zwischen den\n// beiden Fahrstreifen — kein Fahrweg. Die linke Spur wird nur beim Ausweichen und beim\n// Spurwechsel benutzt.\nconst LANE_DRIVE = LANE_RIGHT_CENTER;\n// Steilere Kurve: 55 px Auslenkung auf 460 px Länge statt 45 auf 620 — die maximale Steigung der\n// Kosinus-Flanke (π·A/L) steigt damit von 0,23 auf 0,38, also gut 60 % mehr Querversatz je\n// Längsstrecke. Die Auslenkung ist durch die Zeichenfläche begrenzt: bei 55 px reicht der rechte\n// Fahrbahnrand im Scheitel bis 315 px und bleibt in der 320 px breiten Szene.\nconst CURVE_LENGTH = 460, CURVE_AMPLITUDE = 55;\n// Kurve als glatter \"Buckel\" entlang der Fahrbahn: 0 → Maximalauslenkung → 0 über CURVE_LENGTH.\n// Bei inaktiver Kurve immer 0, damit Straße/Pfad in allen anderen Szenarien unverändert bleiben.\nfunction curveOffsetAt(v, y) {\n  if (!v.curveActive) return 0;\n  const half = CURVE_LENGTH / 2;\n  const u = (y - (v.curveY - half)) / CURVE_LENGTH;\n  if (u <= 0 || u >= 1) return 0;\n  return v.curveDir * CURVE_AMPLITUDE * 0.5 * (1 - Math.cos(2 * Math.PI * u));\n}\n// Geplante Linie: Spurmitte mit leichtem Vorhalt, zur Veranschaulichung der Pfadplanung.\n// Verstärkung und Grenze so gewählt, dass die tanh-Begrenzung NICHT in die Sättigung läuft:\n// mit Gain 1,35 und Grenze 30 lag der Rohwert am Kurvenscheitel bei 60 px und tanh(2,0) ≈ 0,96 —\n// die Ideallinie stand über die halbe Kurve auf dem Anschlag und fiel am Kurvenende steil davon\n// ab. Genau dieser Sprung aus der Sättigung machte den Übergang Kurve → Gerade eckig. 0,9 · 45 =\n// 40 px Rohwert bei Grenze 40 ergibt tanh(1,0) ≈ 0,77: eine durchgehend gekrümmte Linie ohne\n// Plateau, Scheitel bei rund 31 px (bleibt innerhalb der Fahrbahnbegrenzung).\n// Ideallinie jetzt praktisch die Spurmitte mit leichtem Vorhalt:\n// - Vorhalt 30 px statt 90: mit 90 px entsprach die Auslenkung an der Fahrzeugposition der Kurve\n//   90 px WEITER VORN — das Ego lenkte deutlich vor der Kurve ein und stand danach schief zur\n//   Fahrbahn. 30 px bleiben als sanftes Vorausschauen erhalten.\n// - Verstärkung 1,0 und Grenze 200 statt 0,9 / 50: der Scheitelwert der Ideallinie erreicht damit\n//   die Auslenkung der Fahrbahn (55 px) statt nur 37 px. Vorher fuhr das Ego im Scheitel rund\n//   17 px innen an der Spurmitte vorbei, also sichtbar nicht zentral. Die tanh-Begrenzung bleibt\n//   als weiche Sicherung, wirkt in diesem Bereich aber nahezu linear.\nconst IDEAL_APEX_SHIFT = 30, IDEAL_GAIN = 1.0, IDEAL_MAX = 200;\nfunction idealOffsetAt(v, y) {\n  const raw = curveOffsetAt(v, y - IDEAL_APEX_SHIFT) * IDEAL_GAIN;\n  // Weiche Begrenzung statt Abschneiden: die harte Klammer erzeugte am Anschlag einen Knick im\n  // geplanten Pfad, den die Querregelung als Sprung im Querfehler sah.\n  return IDEAL_MAX * Math.tanh(raw / IDEAL_MAX);\n}\n\nconst GLOSSARY = [\n  { term: 'TTC (Time to Collision)', def: 'Zeit bis zur Kollision bei gleichbleibendem Kurs und Tempo.' },\n  { term: 'Querfehler e', def: 'Regelgröße der Querregelung: e = x_soll − x_ist in Metern, also der seitliche Abstand zwischen geplantem Pfad und Fahrzeugmitte – nicht zur Fahrspurmitte. 0 heißt: genau auf dem Pfad, auch bei gewolltem Spur-Offset.' },\n  { term: 'Regelgröße', def: 'Die geregelte Größe selbst, hier der Querfehler e – nicht der Reglerausgang.' },\n  { term: 'Stellgröße u', def: 'Ausgang des Reglers, mit dem er auf die Regelgröße einwirkt: u = Kp · e mit e in Pixeln (quer, 1 m = 40 px) und Kp = 2,4, Einheit px/s.' },\n  { term: 'Maßstab der Szene', def: 'Quer gilt immer 1 m = 40 px. Längs ist der Maßstab szenarioabhängig, damit Sichtweiten über 100 m darstellbar sind: Überholen 2 px/m, Tempolimits 6 px/m, sonst 40 px/m. Sensorreichweiten in der Legende sind entsprechend umgerechnet.' },\n  { term: 'ODD (Operational Design Domain)', def: 'Der Betriebsbereich, in dem das System sicher funktioniert.' },\n  { term: 'Perzeption', def: 'Erkennung von Objekten aus Sensordaten – „was ist da?“.' },\n  { term: 'Tracking', def: 'Verfolgung erkannter Objekte über mehrere Zeitschritte.' },\n  { term: 'Prädiktion', def: 'Vorhersage der zukünftigen Bewegung erkannter Objekte.' },\n  { term: 'Planung', def: 'Berechnung eines sicheren Soll-Pfads bzw. -Verhaltens.' },\n  { term: 'Regelung', def: 'Umsetzung des Plans in konkrete Lenk-/Brems-/Gasbefehle.' },\n];\n\nfunction sensorCone(x, y, range, angleDeg) {\n  const rad = (angleDeg * Math.PI) / 180;\n  const leftX = x - range * Math.tan(rad);\n  const rightX = x + range * Math.tan(rad);\n  const topY = y - range;\n  return `${x},${y} ${leftX},${topY} ${rightX},${topY}`;\n}\n\nclass Component extends DCLogic {\n  nextId = 1;\n\n  initVariant() {\n    return {\n      egoX: LANE_DRIVE,\n      desiredX: LANE_DRIVE,\n      steering: 0,\n      querfehler: 0,\n      ttc: Infinity,\n      speed: 45,\n      sensors: { camera: true, lidar: true, radar: true },\n      obstacles: [],\n      placeType: 'vehicle',\n      longScale: DEFAULT_LONG_SCALE,\n      collided: false,\n      blackout: false,\n      history: [],\n      curSpeed: 45,\n      intersectionY: 60,\n      light: 'green',\n      autoPedActive: false,\n      pedSpawnTimer: 1.2,\n      roadOffset: 0,\n      timeScale: 1,\n      simMs: 0,\n      braking: false,\n      roadCondition: 'trocken',\n      paused: false,\n      stepRequest: false,\n      curveActive: false,\n      curveY: -700,\n      curveDir: 1,\n      curveSeverity: 0,\n      crossActive: false,\n      crossVehicle: { x: 340, vx: -45 },\n    };\n  }\n\n  state = {\n    variants: { b: this.initVariant() },\n    showGlossary: false,\n  };\n\n  setTip = (key) => {\n    this.setState((st) => ({ ...st, openTip: st.openTip === key ? null : key }));\n  };\n\n  toggleGlossary = () => {\n    this.setState((s) => ({ ...s, showGlossary: !s.showGlossary }));\n  };\n\n  applyScenario(key, name) {\n    const v = this.state.variants[key];\n    v.scenario = name;\n    v.flowMs = 0;\n    v.obstacles = [];\n    v.autoPedActive = false;\n    v.collided = false;\n    v.egoX = LANE_DRIVE;\n    v.desiredX = LANE_DRIVE;\n    v.steering = 0;\n    v.ttc = Infinity;\n    v.querfehler = 0;\n    v.history = [];\n    v.stopForLight = false;\n    v.pedAhead = false;\n    v.curveActive = false;\n    v.curveSeverity = 0;\n    v.roadCondition = 'trocken';\n    v.hasIntersection = true;\n    // Folgezustände gehören zum Szenario und werden nur in stepVariant fortgeschrieben — die läuft\n    // bei paused=true nicht. Ohne Reset zeigten Kausalkette und Toter-Winkel-Hinweis nach einem\n    // Szenariowechsel im Pausenzustand weiterhin Angaben aus dem vorherigen Szenario.\n    v.braking = false;\n    v.followingLead = false;\n    v.followHoldUntil = 0;\n    v.pedOccluded = false;\n    v.crossDetected = false;\n    v.crossVelKnown = false;\n    v.blindSpotOccupied = false;\n    v.blindSpotDetected = false;\n    v.evadeReturnOff = 0;\n    v.speedBoost = 0;\n    v.laneRampX = LANE_DRIVE;\n    v.stopSign = false;\n    v.stopSignRead = false;\n    v.stopState = 'approach';\n    v.stopHoldMs = 0;\n    v.brakeDistPx = 0;\n    v.causalStamp = null;\n    v.stackPhase = {};\n    v.crossActive = false;\n    v.simMs = 0;\n    v.yieldForCrossTraffic = false;\n    v.evadeId = null;\n    v.evadeDir = 0;\n    v.obstacles.forEach((o) => { delete o.stepping; });\n    v.laneChangeActive = false;\n    v.laneTargetX = LANE_DRIVE;\n    v.laneChangeState = 'idle';\n    v.laneChangeMsg = '';\n    // Straßentyp gehört zum Szenario: 'twoWay' = ein Fahrstreifen je Richtung (gestrichelte\n    // Mittellinie, links kommt Gegenverkehr), 'oneWay' = Richtungsfahrbahn mit zwei Spuren in\n    // dieselbe Richtung. Nur dort ist ein Spurwechsel nach links überhaupt zulässig.\n    v.roadType = 'twoWay';\n    v.overtakeActive = false;\n    v.oncomingTimer = null;\n    // 8 px/m statt 40: bei 40 px/m zeigte die Szene nur 16 m Straße — kürzer als der Bremsweg bei\n    // 45 km/h (15,6 m) und kürzer als jede Sensorreichweite. Bremsvorgang, Sichtweiten und\n    // Hindernisabstände liegen erst bei 8 px/m (80 m Szene) gemeinsam im sichtbaren Bereich.\n    v.longScale = DEFAULT_LONG_SCALE;\n    if (!v.timeScaleUserSet) v.timeScale = 1;\n    v.signs = [];\n    v.speedCams = [];\n    v.zoneLimit = null;\n    v.known      // Seitenabstand, das Ego fährt vorbei.\n      v.obstacles.push({ id: this.nextId++, type: 'parkfahrzeug', x: 248, y: -420, vx: 0, detected: false });\n      // Der Fußgänger steht 60 px HINTER dem Wagen (aus Ego-Sicht dahinter, also weiter entfernt) —\n      // damit liegt er im Verdeckungsschatten, wird aber als eigener Punkt sichtbar. Vorher lag er\n      // auf derselben x-Position nur 25 px versetzt und verschwand grafisch unter dem Wagen.\n      v.obstacles.push({\n        id: this.nextId++, type: 'fussgaenger', x: 250, y: -480, vx: 0,\n        stepOut: true, directed: true, detected: false,\n      });\n    } else if (name === 'crossing') {\n      v.sensors = { camera: true, lidar: true, radar: true };\n      v.blackout = false;\n      v.light = 'green';\n      v.speed = 45;\n      v.curSpeed = 45;\n      v.intersectionY = -260;\n      v.crossActive = true;\n      v.crossVehicle = { x: 340, vx: -45 };\n      v.stopSign = true;\n    } else if (name === 'laneChange') {\n      v.sensors = { camera: true, lidar: true, radar: true };\n      v.blackout = false;\n      v.light = 'green';\n      v.speed = 60;\n      v.curSpeed = 60;\n      v.intersectionY = -5000;\n      v.hasIntersection = false;\n      v.roadType = 'oneWay';\n      v.laneChangeActive = true;\n      v.egoX = LANE_RIGHT_CENTER;\n      v.desiredX = LANE_RIGHT_CENTER;\n      v.laneTargetX = LANE_RIGHT_CENTER;\n      v.laneRampX = LANE_RIGHT_CENTER;\n      v.laneChangeState = 'idle';\n      v.laneChangeMsg = 'Vorausfahrender ist langsamer, auf der linken Spur läuft schnellerer Verkehr. Eine Lücke abwarten und Spurwechsel anfordern.';\n      // Langsamer Vorausfahrender auf der eigenen Spur — Anlass für den Wechsel.\n      v.obstacles.push({ id: this.nextId++, type: 'vehicle', x: LANE_RIGHT_CENTER, y: -60, vx: 0, pace: 34, detected: false });\n      // Verkehr auf der Überholspur: vier Fahrzeuge mit 95 km/h gegen 60 km/h des Ego, in\n      // ungleichen Abständen. Ein einzelnes Fahrzeug mit GLEICHEM Tempo blieb dauerhaft neben dem\n      // Ego stehen — der tote Winkel war belegt und ein Spurwechsel damit nie möglich. Jetzt\n      // ziehen die Fahrzeuge vorbei: zwischen ihnen entstehen Lücken, und die Aufgabe ist, den\n      // Wechsel in eine Lücke zu legen. Das erste startet direkt neben dem Ego, also im toten\n      // Winkel: ohne Lidar sieht der Stack es nicht.\n      [\n        { y: EGO_Y - 6, blindSpot: true },\n        { y: EGO_Y + 280 },\n        { y: EGO_Y + 600 },\n        { y: EGO_Y + 980 },\n      ].forEach((c) => {\n        v.obstacles.push({\n          id: this.nextId++, type: 'vehicle', x: LANE_LEFT_CENTER, y: c.y, vx: 0,\n          pace: 95, traffic: true, blindSpot: !!c.blindSpot, detected: false,\n        });\n      });\n    } else if (name === 'speedLimit') {\n      v.sensors = { camera: true, lidar: true, radar: true };\n      v.blackout = false;\n      v.light = 'green';\n      v.speed = 80;\n      v.curSpeed = 80;\n      v.intersectionY = -5000;\n      v.hasIntersection = false;\n      v.roadType = 'twoWay';\n      // 6 px/m: die Szene zeigt gut 100 m, die Zonen liegen 50 m auseinander — die Fahrt wirkt\n      // dadurch deutlich zügiger als bei 4 px/m, ohne dass die Zeiten unrealistisch werden.\n      v.longScale = 0.15;\n      v.zoneLimit = 80;\n      // Reihenfolge in Fahrtrichtung: 30er-Schild, Blitzer in der 30er-Zone, 70er, 50er, Blitzer in\n      // der 50er-Zone. Je 300 px = 75 m Abstand, danach wiederholt sich die Strecke.\n      v.signs = [\n        { id: this.nextId++, y: -120, limit: 30 },\n        { id: this.nextId++, y: -720, limit: 70 },\n        { id: this.nextId++, y: -1020, limit: 50 },\n      ];\n      v.speedCams = [\n        { id: this.nextId++, y: -420 },\n        { id: this.nextId++, y: -1320 },\n      ];\n    } else if (name === 'overtake') {\n      v.sensors = { camera: true, lidar: true, radar: true };\n      v.blackout = false;\n      v.light = 'green';\n      v.speed = 90;\n      v.curSpeed = 90;\n      // Die  = Math.min((ts - this.lastTs) / 1000, 0.05);\n    this.lastTs = ts;\n    const v = this.state.variants.b;\n    // Pause hält die Physik an; ein Einzelschritt gibt genau einen kleinen, festen Zeitschritt frei,\n    // damit der Moment der Erkennung Frame für Frame untersucht werden kann.\n    // Darstellungstempo: skaliert ausschließlich den Zeitschritt der Wiedergabe. Alle angezeigten\n    // Größen (km/h, TTC, Sekunden) bleiben unverändert — die Szene läuft nur langsamer ab.\n    // Ein Fehler im Rechenschritt darf die Animationsschleife nicht abreißen lassen: sonst\n    // steht die Szene, während requestAnimationFrame weiterläuft und die Bedienung normal\n    // aussieht. Der Fehler wird gemeldet, die Schleife läuft weiter.\n    try {\n      if (!v.paused) {\n        this.stepVariant('b', dt * (v.timeScale ?? 1));\n      } else if (v.stepRequest) {\n        v.stepRequest = false;\n        this.stepVariant('b', 1 / 30);\n      }\n      this.setState((s) => ({ ...s }));\n    } catch (err) {\n      console.error('Rechenschritt fehlgeschlagen', err);\n    }\n    this.raf = requestAnimationFrame(this.tick);\n  };\n\n  // Eine einzige Prüfung für Freigabe UND Statusanzeige. Vorher rechneten beide getrennt und die\n  // GUI widersprach sich: oben \"Toter Winkel frei\", darunter \"Freigabe verweigert — Fahrzeug im\n  // toten Winkel\".\n  laneGapCheck(v, target) {\n    const pxPerMl = PX_PER_M * (v.longScale ?? DEFAULT_LONG_SCALE);\n    const occupant = v.obstacles.find(\n      (o) => Math.abs(o.x - target) < 45 && o.y > EGO_Y - 150 && o.y < EGO_Y + 70\n    );\n    // Maßgeblich ist nicht eine pauschale Zeitlücke, sondern die Strecke, die das Ego während des\n    // BESCHLEUNIGENS auf Flusstempo verliert. Es schert mit dem Folgetempo aus (beim Auffahren auf\n    // den langsamen Vorausfahrenden rund 34 km/h) und braucht bei 3,0 m/s² mehrere Sekunden auf\n    // 95 km/h. In dieser Zeit holt ein hinten fahrendes Fahrzeug mit der halben\n    // Geschwindigkeitsdifferenz auf — genau diese Strecke muss frei sein, sonst fährt es auf.\n    // Eine feste Zeitschwelle ließ den Wechsel in Lücken zu, die dafür zu kurz waren.\n    let nearest = null;\n    let gapPx = Infinity;\n    let flowKmh = 0;\n    if (target === LANE_LEFT_CENTER) {\n      v.obstacles.forEach((o) => {\n        if (o.type === 'fussgaenger' || o.oncoming) return;\n        if (Math.abs(o.x - target) > 45) return;\n        if (o.y <= EGO_Y - 20) return;\n        const g = o.y - (EGO_Y - 20);\n        if (g < gapPx) {\n          gapPx = g;\n          nearest = o;\n          flowKmh = o.pace || 0;\n        }\n      });\n    }\n    const dvKmh = Math.max(0, flowKmh - v.curSpeed);\n    const tAcc = dvKmh / (ACCEL_MS2 * 3.6);\n    // Mittlere Differenzgeschwindigkeit über die Beschleunigungsphase, plus 15 m Zuschlag für den\n    // Querweg und den Sicherheitsabstand danach.\n    const needM = ((dvKmh / 2) * 1000) / 3600 * tAcc + 15;\n    const needPx = needM * pxPerMl;\n    return {\n      occupant,\n      approaching: nearest,\n      gapPx,\n      needPx,\n      gapM: gapPx === Infinity ? Infinity : gapPx / pxPerMl,\n      needM,\n      tightGap: !!nearest && gapPx < needPx,\n    };\n  }\n\n  requestLaneChange(key) {\n    const v = this.state.variants[key];\n    if (!v.laneChangeActive || v.collided) return;\n    const target = v.laneTargetX === LANE_LEFT_CENTER ? LANE_RIGHT_CENTER : LANE_LEFT_CENTER;\n    // Überholen auf der Landstraße: nicht \"ist der Platz frei\", sondern \"reicht die Zeit\".\n    // Verglichen wird die Dauer des Überholwegs mit der Zeit, bis der Gegenverkehr hier ist.\n    if (v.overtakeActive && target === LANE_LEFT_CENTER) {\n      const lead = v.obstacles\n        .filter((o) => !o.oncoming && o.type !== 'fussgaenger' && o.y < EGO_Y && Math.abs(o.x - LANE_DRIVE) < 40)\n        .sort((a, b) => b.y - a.y)[0];\n      const onc = v.obstacles.filter((o) => o.oncoming && o.y < EGO_Y).sort((a, b) => b.y - a.y)[0];\n      const pxPerM = PX_PER_M * (v.longScale ?? DEFAULT_LONG_SCALE);\n      // In Metern gerechnet, damit die Zahlen unabhängig vom Längsmaßstab stimmen: Lücke zum\n      // Vorausfahrenden schließen, vorbeiziehen, wieder einordnen (+25 m Sicherheitszuschlag).\n      const leadGapM = (lead ? EGO_Y - lead.y : 140) / pxPerM;\n      const relKmh = Math.max(8, v.speed - ((lead && lead.pace) || 0));\n      const relMs = (relKmh * 1000) / 3600;\n      const tOver = (leadGapM + 25) / relMs;\n      const radarOk = !v.blackout && v.sensors.radar;\n      const radarRangeM = Math.round(420 / pxPerM);\n      if (!onc || !onc.detected) {\n        v.laneChangeState = 'moving';\n        v.laneTargetX = LANE_LEFT_CENTER;\n        v.laneChangeMsg =\n          'Freigabe erteilt — im Sensorbereich (Radar bis ' + radarRangeM + ' m) kein Gegenverkehr. Überholweg ' +\n          tOver.toFixed(1) + ' s über ' + Math.round(leadGapM + 25) + ' m. Was jenseits der Reichweite liegt, weiß das System nicht.';\n      } else {\n        // Ohne Radar fehlt die Relativgeschwindigkeit: die Planung kann nur die eigene\n        // Geschwindigkeit ansetzen und überschätzt die verfügbare Zeit um mehr als das Doppelte.\n        const closingKmh = radarOk ? v.curSpeed + Math.abs(onc.pace || 0) : v.curSpeed;\n        const tOnc = (EGO_Y - onc.y) / pxPerM / Math.max((closingKmh * 1000) / 3600, 1);\n        if (tOnc > tOver + 1.5) {\n          v.laneChangeState = 'moving';\n          v.laneTargetX = LANE_LEFT_CENTER;\n          v.laneChangeMsg =\n            'Freigabe erteilt — Überholweg ' + tOver.toFixed(1) + ' s, Gegenverkehr in ' +\n            tOnc.toFixed(1) + ' s, Reserve ' + (tOnc - tOver).toFixed(1) + ' s.' +\n            (radarOk ? '' : ' Ohne Radar mit ' + Math.round(closingKmh) + ' km/h statt der wirklichen Annäherung gerechnet — die Reserve existiert nur auf dem Papier.');\n        } else {\n          v.laneChangeState = 'blocked';\n          v.laneChangeMsg =\n            'Freigabe verweigert — der Überholweg braucht ' + tOver.toFixed(1) +\n            ' s, der Gegenverkehr ist in ' + tOnc.toFixed(1) + ' s hier. Lücke zu klein.';\n        }\n      }\n      this.setState((s) => ({ ...s }));\n      return;\n    }\n    // Von hinten aufkommender Verkehr: nicht nur \"steht dort JETZT etwas\", sondern \"wie lange\n    // dauert es, bis etwas hier ist\". Erkannt wird das nur innerhalb der Lidar-Reichweite —\n    // Kamera und Radar schauen nach vorn.\n    const { occupant, approaching, gapM, needM, tightGap } = this.laneGapCheck(v, target);\n    if (occupant && occupant.detected) {\n      v.laneChangeState = 'blocked';\n      v.laneChangeMsg = 'Freigabe verweigert — Lidar meldet ein Fahrzeug im toten Winkel. Der Wechsel wird nicht ausgeführt.';\n    } else if (tightGap && approaching.detected) {\n      v.laneChangeState = 'blocked';\n      v.laneChangeMsg =\n        'Freigabe verweigert — Lücke nach hinten ' + Math.round(gapM) + ' m, gebraucht werden ' +\n        Math.round(needM) + ' m. Das Ego schert mit ' + Math.round(v.curSpeed) +\n        ' km/h aus und braucht die Strecke, um auf Flusstempo zu beschleunigen.';\n    } else if (tightGap) {\n      v.laneChangeState = 'moving';\n      v.laneTargetX = target;\n      v.laneChangeMsg =\n        'Freigabe erteilt — kein rückwärts messender Sensor aktiv. Physisch sind es nur ' +\n        Math.round(gapM) + ' m Lücke bei ' + Math.round(needM) + ' m Bedarf; für den Stack existiert das Fahrzeug nicht.';\n    } else if (occupant) {\n      v.laneChangeState = 'moving';\n      v.laneTargetX = target;\n      v.laneChangeMsg = 'Freigabe erteilt — kein Sensor deckt den toten Winkel ab, der Platz gilt als frei.';\n    } else {\n      v.laneChangeState = 'moving';\n      v.laneTargetX = target;\n      v.laneChangeMsg = 'Freigabe erteilt — Zielspur ist überwacht und frei.';\n    }\n    this.setState((s) => ({ ...s }));\n  }\n\n  setTimeScale(key, val) {\n    // Sobald der Nutzer das Darstellungstempo selbst wählt, bleibt es über Szenariowechsel hinweg\n    // stehen — Szen tionY - EGO_Y > 80) {\n        v.intersectionY -= 900;\n        // Nächste Kreuzung: Haltepflicht am Stoppschild gilt erneut.\n        v.stopSignRead = false;\n        v.stopState = 'approach';\n        v.stopHoldMs = 0;\n      }\n    }\n\n    // -- Tempolimits: Schilder scrollen wie alles andere heran. Lesen kann sie ausschließlich die\n    // Kamera (Verkehrszeichenerkennung); das gelesene Limit begrenzt danach die Sollgeschwindigkeit.\n    // Die Zone selbst gilt beim Passieren des Schildes — unabhängig davon, ob es erkannt wurde.\n    // Genau diese Trennung macht den Ausfall messbar: der Blitzer vergleicht mit der Zone, nicht mit\n    // dem, was das Fahrzeug zu wissen glaubt.\n    const SIGN_LOOP = 1500;\n    (v.signs || []).forEach((s) => {\n      s.y += scrollPxS * dt;\n      const dyS = EGO_Y - s.y;\n      if (!s.read && eff.camera && dyS > 0 && dyS < 240) {\n        s.read = true;\n        s.readAt = v.simMs || 0;\n        v.knownLimit = s.limit;\n      }\n      if (!s.passed && dyS <= 0) {\n        s.passed = true;\n        v.zoneLimit = s.limit;\n      }\n      if (s.y > EGO_Y + 140) {\n        s.y -= SIGN_LOOP;\n        s.read = false;\n        s.passed = false;\n        s.readAt = 0;\n      }\n    });\n    (v.speedCams || []).forEach((c) => {\n      c.y += scrollPxS * dt;\n      if (!c.triggered && EGO_Y - 24 - c.y <= 0) {\n        c.triggered = true;\n        const limit = v.zoneLimit ?? v.speed;\n        const measured = Math.round(v.curSpeed);\n        if (measured > limit + 5) {\n          v.flashUntil = (v.simMs || 0) + 400;\n          v.ticketTitle = 'Geblitzt: ' + measured + ' km/h bei erlaubten ' + limit + ' km/h';\n          // Zwei kurze Zeilen: die Szene ist 320 Einheiten breit, längere Sätze werden am Rand\n          // abgeschnitten — bei 10,5 px passen rund 40 Zeichen je Zeile.\n          if (!eff.camera) {\n            v.ticketText = 'Kamera aus — Schild nicht gelesen.';\n            v.ticketText2 = 'Sollwert blieb bei ' + Math.round(v.s nextId++,\n          type: 'fussgaenger',\n          x: fromLeft ? 75 : 245,\n          y: crossWalkY,\n          vx: fromLeft ? 48 : -48,\n          detected: false,\n          auto: true,\n        });\n        v.autoPedActive = true;\n        v.pedSpawnTimer = 2.4;\n      }\n    } else {\n      if (v.autoPedActive) {\n        v.obstacles = v.obstacles.filter((o) => !o.auto);\n        v.autoPedActive = false;\n      }\n      v.pedSpawnTimer = 1.2;\n    }\n\n    // Gegenverkehr nur in Szenarien, die ihn brauchen: oncomingTimer ist sonst null und es\n    // entsteht kein Verkehr auf der Gegenspur.\n    if (v.oncomingTimer != null) {\n      v.oncomingTimer -= dt;\n      if (v.oncomingTimer <= 0) {\n        // Fester Takt und feste Geschwindigkeit: der Lernende soll die Lücke abschätzen können und\n        // nicht von einem gewürfelten Fahrzeug überrascht werden. Wer auf der Gegenspur verweilt,\n        // trifft nach spätestens 16 s das nächste — das ist die Lehre, kein Zufall.\n        v.obstacles.push({\n          id: this.nextId++, type: 'vehicle', x: LANE_LEFT_CENTER, y: -220, vx: 0,\n          pace: -60, oncoming: true, detected: false,\n        });\n        v.oncomingTimer = 16;\n      }\n    }\n\n    v.obstacles.forEach((o) => {\n      // Das Fahrzeug im toten Winkel f\\u00e4hrt definitionsgem\\u00e4\\u00df mit \\u2014 sein Tempo folgt dem Ego,\n      // damit es beim Abbremsen hinter dem Vorausfahrenden nicht davonzieht.\n      // Teilweise mitlaufend: mit paceFactor < 1 nähert sich das Objekt dem Ego longitudinal an,\n      // sodass die Kollisionsbox (dy < 24) überhaupt erreichbar ist. Bei paceFactor = 1 bliebe dy\n      // konstant und ein Zusammenstoß wäre strukturell unmöglich.\n      // Der Mitlauf-Override gilt NICHT für den Verkehr auf der Überholspur: dessen Fahrzeuge\n      // haben ein eigenes, höheres Tempo und sollen vorbeiziehen. Mit dem Override wurde das\n      // erste Fahrzeug jeden Frame auf Ego-Tempo zurückgesetzt und blieb dauerhaft im to ;\n      const tReach = Math.max(0, distToStopLine) / planPxS;\n      const tClear = (Math.max(0, distToStopLine) + INTERSECTION_DEPTH) / planPxS;\n      const speedX = Math.abs(v.crossVehicle.vx) || 1;\n      // Fenster des aktuellen Querfahrzeugs …\n      const tIn = (v.crossVehicle.x - (v.egoX + CROSS_HALF)) / speedX;\n      const tOut = (v.crossVehicle.x - (v.egoX - CROSS_HALF)) / speedX;\n      // … und des nächsten nach dem Respawn bei x = 340.\n      const tRespawn = (v.crossVehicle.x + 40) / speedX;\n      const tIn2 = tRespawn + (340 - (v.egoX + CROSS_HALF)) / speedX;\n      const tOut2 = tRespawn + (340 - (v.egoX - CROSS_HALF)) / speedX;\n      const overlaps = (a2, b2) => tClear > a2 && tReach < b2;\n      const conflictAhead = overlaps(tIn, tOut) || overlaps(tIn2, tOut2);\n      // Ist Ego bereits über der Haltelinie, wird nicht mehr angehalten — dann gilt Räumen.\n      yieldForCrossTraffic = conflictAhead && distToStopLine > -6 && distToStopLine < brakeWindow + INTERSECTION_DEPTH;\n    }\n    // Mit Radar kann die Prädiktion die Bewegung des Fußgängers extrapolieren und schon reagieren,\n    // bevor er den Fahrweg erreicht. Ohne Radar reagiert die Planung erst, wenn er wirklich davor steht.\n    const pedAhead = v.obstacles.some((o) => {\n      if (o.type !== 'fussgaenger' || !o.detected) return false;\n      const dyPed = EGO_Y - o.y;\n      if (dyPed <= 0) return false;\n      // Prädiktion einer Querbahn setzt BEIDES voraus: Geschwindigkeit (Radar) und Klasse (Kamera).\n      // Radar allein liefert keine verlässliche Winkelauflösung und keine Objektklasse — ein\n      // unklassifiziertes Echo am Straßenrand wird nicht als querender Fußgänger vorhergesagt.\n      // Ohne Kamera reagiert die Planung deshalb erst, wenn das Objekt real im Fahrkorridor steht\n      // (Nothalt), und nicht vorausschauend. Vorher bremste das Fahrzeug im Szenario \"Blindes\n      // Rotlicht\" auf einen Fußgänger, den es laut Sensorlage gar nicht als solchen kennt.\n      if (o.velKnown && o.classKnown) {\n        // Die Prädiktion löst, OB die vorhergesagte Bahn den Fahrkorridor schneidet, während das Ego\n        // ihn passiert — Eintritts- und Austrittszeit gegen die Zeit bis zum Ego. Ein Test der\n        // Endposition nach festem Horizont schlägt fehl, sobald das Objekt den Korridor im\n        // Extrapolationsfenster durchquert und rechts davon herauskommt.\n        const CORR = 30;\n        const tArrive = dyPed / Math.max(scrollPxS, 1);\n        let entersPath = Math.abs(o.x - v.egoX) < CORR;\n        if (!entersPath && Math.abs(o.vx) > 1) {\n          const t1 = (v.egoX - CORR - o.x) / o.vx;\n          const t2 = (v.egoX + CORR - o.x) / o.vx;\n          const tIn = Math.min(t1, t2), tOut = Math.max(t1, t2);\n          // Reaktions- und Bremszeit mit einrechnen: relevant ist das Fenster bis zum Passieren.\n          entersPath = tOut > 0 && tIn < tArrive + 0.8;\n        }\n        return dyPed < 230 && entersPath;\n      }\n      return dyPed < 170 && Math.abs(o.x - v.egoX) < 30;\n    });\n    const mustStop = stopForLight || stopForSign || pedAhead || yieldForCrossTraffic;\n    v.stopForSign = stopForSign;\n    v.stopForLight = stopForLight;\n    v.pedAhead = pedAhead;\n    v.yieldForCrossTraffic = yieldForCrossTraffic;\n    v.crossDetected = crossDetected;\n    // Der Querverkehr war bisher rein visuell — ein Zusammenstoß blieb ohne Folge.\n    if (\n      v.crossActive &&\n      Math.abs(v.crossVehicle.x - v.egoX) < 32 &&\n      Math.abs(v.intersectionY - (EGO_Y - 24)) < 30 &&\n      v.curSpeed > 2\n    ) {\n      v.collided = true;\n    }\n\n    // -- Kurve voraus: Pfadplanung reduziert die Sollgeschwindigkeit, sobald die Krümmung erreicht\n    // oder in kurzer, fester Vorausschau (nicht geschwindigkeitsskaliert) erkannt wird — sonst\n    // überschießt die Vorausschau bei hohem Tempo weit über die Kurve hinaus und die Bremsung bleibt aus.\n    const curveLookahead = 220;\n    const curveSeverityRaw = v.curveActive\n      ? Math.max(Math.abs(curveOffsetAt(v, EGO_Y)), Math.abs(curveOffsetAt(v, EGO_Y - curveLookahead))) / CURVE_AMPLITUDE\n      : 0;\n    // Zeitkonstante 0,3 s: das Maximum zweier Abtastpunkte springt beim Wechsel des maßgeblichen\n    // Punktes: der Tiefpass macht daraus einen stetigen Verlauf. dt = 0 (Szenariostart) übernimmt\n    // den Wert direkt, damit die Anzeige nicht erst einläuft.\n    const kSev = dt > 0 ? 1 - Math.exp(-dt / 0.3) : 1;\n    v.curveSeverity = (v.curveSeverity ?? 0) + (curveSeverityRaw - (v.curveSeverity ?? 0)) * kSev;\n    const curveSeverity = v.curveSeverity;\n    const CURVE_MIN_SPEED = 35;\n    const curveTargetSpeed = v.speed - (v.speed - CURVE_MIN_SPEED) * curveSeverity;\n\n    // -- Folgefahrt: auf ein erkanntes langsameres Fahrzeug in der eigenen Spur wird die\n    // Sollgeschwindigkeit auf dessen Tempo geregelt, statt ungebremst aufzufahren. Der Abstand\n    // wird dabei geschwindigkeitsabhängig gehalten (Faustregel halber Tacho).\n    let followSpeed = Infinity;\n    let followingLead = false;\n    // Hysterese: während eines Spurwechsels wandert das Ego seitlich am Vorausfahrenden vorbei.\n    // Ohne unterschiedliche Ein-/Aussteige-Schwellen wechselt \"folgt\" im Frametakt hin und her.\n    const followBand = v.followingLead ? 46 : 30;\n    v.obstacles.forEach((o) => {\n      if (o.type === 'fussgaenger' || !o.detected) return;\n      // Während eines freigegebenen Wechsels nach links wird nicht mehr auf den Vorausfahrenden\n      // geregelt: das Ego muss beschleunigen können, um auf Flusstempo der Überholspur zu kommen.\n      // Sonst schert es mit Folgetempo aus und wird von hinten aufgefahren.\n      if (\n        v.laneChangeActive &&\n        v.laneChangeState === 'moving' &&\n        v.laneTargetX === LANE_LEFT_CENTER &&\n        !o.traffic\n      ) return;\n      // Ein parkendes Fahrzeug ist kein Vorausfahrender: darauf wird nicht die Längsführung\n      // geregelt (sonst rollt das Ego dahinter aus), es wird vor       v.lastFollowSpeed = followSpeed;\n    } else if (v.followHoldUntil && nowFollow < v.followHoldUntil) {\n      followingLead = true;\n      followSpeed = v.lastFollowSpeed ?? Infinity;\n    }\n    v.followingLead = followingLead;\n\n    // Während eines Ausweichmanövers wird das Tempo moderat zurückgenommen statt bis zum Stillstand.\n    const evading = Math.abs(v.desiredX - (v.laneChangeActive ? v.laneTargetX : LANE_DRIVE + idealOffsetAt(v, EGO_Y))) > 8;\n    // Beim Überholen wird über das Solltempo hinaus beschleunigt — sonst zieht das Ego nie am\n    // Vorausfahrenden vorbei, sondern fährt neben ihm mit.\n    const speedCandidates = [v.speed + (v.speedBoost || 0)];\n    // Das erkannte Tempolimit begrenzt den Sollwert. Ohne Kamera bleibt v.knownLimit auf dem\n    // zuletzt gelesenen Wert stehen (oder null) — das Fahrzeug hält an einer Vorgabe fest, die\n    // nicht mehr gilt.\n    if (v.knownLimit) speedCandidates.push(v.knownLimit);\n    if (signApproachSpeed !== Infinity) speedCandidates.push(signApproachSpeed);\n    if (evading) speedCandidates.push(Math.max(25, v.speed * 0.72));\n    if (v.curveActive) speedCandidates.push(curveTargetSpeed);\n    if (followSpeed !== Infinity) speedCandidates.push(followSpeed);\n    const desiredSpeed = mustStop ? 0 : Math.min(...speedCandidates);\n    // Beschleunigen ist unabhängig von der Fahrbahnreibung (Motorleistung), Bremsen nicht — bei\n    // Nässe/Glätte kann die Regelung nicht stärker verzögern, als die Reifen Grip haben.\n    // Dieselben Kennwerte, die auch in den Bremsweg eingehen — sonst zeigt die Szene eine Strecke\n    // an, die das Fahrzeug gar nicht fährt. 3,0 m/s² Beschleunigung, 5,0 m/s² Verzögerung\n    // (·3,6 = km/h pro Sekunde).\n    const maxAccelDelta = ACCEL_MS2 * 3.6 * dt;\n    const maxBrakeDelta = DECEL_MS2 * 3.6 * FRICTION * dt;\n    if (desiredSpeed > v.curSpeed) v.curSpeed = Math.min(desiredSpeed, v.curSpeed + maxAccelDelta);\n    else v.curSpeed = Math.max(desiredSpeed, v.curSpeed - maxBrakeDelta);\n    v.braking = v.curSpeed < v.speed - 1;\n    v.roadOffset = (v.roadOffset + scrollPxS * dt) % 28;\n\n    const inPath = v.obstacles.filter((o) => EGO_Y - o.y > 0 && Math.abs(o.x - v.egoX) < 26);\n    if (inPath.length) {\n      inPath.sort((a2, b2) => (EGO_Y - a2.y) - (EGO_Y - b2.y));\n      const near = inPath[0];\n      const dyy = EGO_Y - near.y;\n      // TTC = Abstand / RELATIVgeschwindigkeit. Mit der absoluten Ego-Geschwindigkeit gerechnet\n      // wird sie bei mitfahrenden Objekten (eigene pace) systematisch zu klein und damit zu\n      // alarmierend, obwohl kaum eine Annäherung stattfindet.\n      const nearPaceP = ((near.pace || 0) * 1000) / 3600 * pxPerM;\n      const closingPxS = scrollPxS - nearPaceP;\n      v.ttc = closingPxS > 0.5 ? dyy / closingPxS : Infinity;\n      if (dyy < 24 && v.curSpeed > 2) v.collided = true;\n    } else {\n      v.ttc = Infinity;\n    }\n    // TTC auch gegen den Querverkehr — er liegt nicht im longitudinalen Fahrkorridor und blieb\n    // deshalb bisher unberücksichtigt: die Anzeige stand im Kreuzungsszenario bis zum Zusammenstoß\n    // auf ∞. Kollisionszeit ist die Ankunft des Ersten am Konfliktpunkt, sofern beide Durchfahrts-\n    // fenster sich überschneiden; fährt eines vorher durch, gibt es keine.\n    if (v.crossActive && v.crossDetected) {\n      const tEgo = (EGO_FRONT_Y - v.intersectionY) / Math.max(scrollPxS, 1);\n      const speedXt = Math.abs(v.crossVehicle.vx) || 1;\n      const tCross = (v.crossVehicle.x - v.egoX) / speedXt;\n      if (tEgo > 0 && tCross > 0 && Math.abs(tEgo - tCross) < 1.2) {\n        v.ttc = Math.min(v.ttc, Math.min(tEgo, tCross));\n      }\n    }\n    v.history.push(v.querfehler);\n    if (v.history.length > 80) v.history.shift();\n  }\n\n  setRoadCondition(key, cond) {\n    const v = this.state.variants[key];\n    v.roadCondition = cond;\n    this.setState((s) => ({ ...s }));\n  }\n\n  setLight(key, color) {\n    const v = this.state.variants[key];\n    v.light = color;\n    this.setState((s) => ({ ...s }));\n  }\n\n  onSceneClick(key, e) {\n    const rect = e.currentTarget.getBoundingClientRect();\n    const v = this.state.variants[key];\n    const x = (e.clientX - rect.left) * (320 / rect.width);\n    const y = (e.clientY - rect.top) * (640 / rect.height);\n    if (y > 460) return;\n    const clampedX = Math.max(70, Math.min(250, x));\n    // Querbewegung liegt am Quermaßstab (unverändert 40 px/m): 48 px/s = 1,2 m/s, normales\n    // Gehtempo. Die alten 22 px/s entsprachen 0,55 m/s und damit keinem realen Fußgänger.\n    const vx = v.placeType === 'fussgaenger' ? (Math.random() < 0.5 ? -1 : 1) * 48 : 0;\n    v.obstacles.push({ id: this.nextId++, type: v.placeType, x: clampedX, y, vx, detected: false });\n    this.setState((s) => ({ ...s }));\n  }\n\n  removeObstacle(key, id) {\n    const v = this.state.variants[key];\n    v.obstacles = v.obstacles.filter((o) => o.id !== id);\n    this.setState((s) => ({ ...s }));\n  }\n\n  clearObstacles(key) {\n    this.state.variants[key].obstacles = [];\n    this.setState((s) => ({ ...s }));\n  }\n\n  setSensor(key, name) {\n    const v = this.state.variants[key];\n    v.sensors[name] = !v.sensors[name];\n    this.setState((s) => ({ ...s }));\n  }\n\n  setPlaceType(key, t) {\n    this.state.variants[key].placeType = t;\n    this.setState((s) => ({ ...s }));\n  }\n\n  setSpeed(key, val) {\n    this.state.variants[key].speed = val;\n    this.setState((s) => ({ ...s }));\n  }\n\n  toggleBlackout(key) {\n    const v = this.state.variants[key];\n    v.blackout = !v.blackout;\n    this.setState((s) => ({ ...s }));\n  }\n\n  resetVariant(key) {\n    // Zurücksetzen startet das AKTUELLE Szenario neu — vorher fiel es auf den Grundzustand zurück\n    // und verwarf dabei Szenariowahl, Maßstab und Sensorbild. Vom Nutzer gesetztes Darstellungs-\n    // tempo und die gewählte Objektart überleben den Reset, weil das Bedieneinstellungen sind\n    // und keine Simulationszustände.\n    const prev = this.state.variants[key];\n    const fresh = this.initVariant();\n    fresh.timeScale = prev.timeScale;\n    fresh.timeScaleUserSet = prev.timeScaleUserSet;\n    fresh.placeType = prev.placeType;\n    this.state.variants[key] = fresh;\n    if (prev.scenario) this.applyScenario(key, prev.scenario);\n    else this.setState((s) => ({ ...s }));\n  }\n\n  buildDisplay(key) {\n    const v = this.state.variants[key];\n    const EGO_FRONT_Y_DISPLAY = EGO_Y - 24;\n    const range = { camera: 260, radar: 420, lidar: 210 };\n    const pxPerMD = PX_PER_M * (v.longScale ?? DEFAULT_LONG_SCALE);\n\n    // Verdeckungsschatten: der Bereich hinter einem parkenden Fahrzeug, den von der Ego-Position\n    // aus KEIN Sensor einsehen kann. Bisher war die Verdeckung nur in der Logik vorhanden — auf\n    // der Fahrbahn war nichts davon zu sehen, das Szenario wirkte ereignislos. Strahlensatz:\n    // Geraden von der Ego-Position durch die beiden Seitenkanten des Wagens, verlängert bis zum\n    // oberen Szenenrand.\n    const shadowsDisp = v.obstacles\n      .filter((o) => o.type === 'parkfahrzeug' && EGO_Y - o.y > 30)\n      .map((o) => {\n        const halfW = 24;\n        const t = EGO_Y / Math.max(EGO_Y - o.y, 1);\n        const extL = v.egoX + (o.x - halfW - v.egoX) * t;\n        const extR = v.egoX + (o.x + halfW - v.egoX) * t;\n        return {\n          id: o.id,\n          pts: [o.x - halfW, o.y, o.x + halfW, o.y, extR, 0, extL, 0].join(' '),\n          labelX: Math.max(8, Math.min(232, o.x - 46)),\n          labelY: Math.max(14, o.y - 26),\n        };\n      });\n    const shadowActive = v.pedOccluded;\n    const shadowColor = shadowActive ? 'oklch(52% 0.17 25)' : 'oklch(45% 0.02 255)';\n\n    const obstaclesDisp = v.obstacles.map((o) => {\n      const meta =\n        o.type === 'vehicle'\n          ? { isCircle: false, isRect: true, w: 26, h: 40, fill: 'oklch(70% 0.13 70)' }\n          : o.type === 'fussgaenger'\n          ? { isCircle: true, isRect: false, r: 9, fill: 'oklch(56% 0.
