n();\n          this.removeObstacle(key, o.id);\n        } };\n    });\n\n    const anySensor = v.sensors.camera || v.sensors.lidar || v.sensors.radar;\n    const effOn = !v.blackout && anySensor;\n    // Das Querfahrzeug lebt außerhalb von v.obstacles, ist für die Kette aber ein Objekt wie jedes\n    // andere — sonst bleiben Perzeption und Tracking im Kreuzungsszenario dunkel.\n    const anyDetected = v.obstacles.some((o) => o.detected) || !!v.crossDetected;\n    const anyMovingDetected = v.obstacles.some((o) => o.detected && o.type === 'fussgaenger') || !!v.crossDetected;\n    // Prädiktion setzt Geschwindigkeitsinformation voraus — die liefert nur das Radar.\n    // Dieselbe Bedingung wie in der Planung: Prädiktion braucht Geschwindigkeit (Radar) UND Klasse\n    // (Kamera). Sonst leuchtet der Stack-Block \"Prädiktion\" als aktiv, während gar nicht\n    // vorhergesagt wird — genau der Widerspruch, den das Modul zeigen soll.\n    const anyPredictable =\n      v.obstacles.some((o) => o.velKnown && o.classKnown && o.type === 'fussgaenger') ||\n      (!!v.crossVelKnown && !!v.crossClassKnown);\n    const lightDetected = effOn && v.sensors.camera && !v.blackout;\n    // Die Planung ist immer dann aktiv, wenn sie eine Vorgabe ändert — auch bei Vorfahrt und\n    // Folgefahrt. Die reine Prüfung auf laterale Pfadänderung und Ampel/Fußgänger ließ den Block\n    // dunkel, obwohl sichtbar geregelt wurde.\n    const lateralBase = v.laneChangeActive ? v.laneTargetX : LANE_DRIVE + idealOffsetAt(v, EGO_Y);\n    const planningActive =\n      Math.abs(v.desiredX - lateralBase) > 2 ||\n      v.stopForLight ||\n      v.pedAhead ||\n      v.yieldForCrossTraffic ||\n      v.followingLead ||\n      (v.curveActive && v.curveSeverity > 0.12);\n    const activeMap = {\n      sensorik: effOn,\n      perzeption: (anyDetected || (lightDetected && v.light !== 'green')) && effOn,\n      tracking: anyDetected && effOn,\n      praediktion: anyPredictable && effOn,\n      planung: planningActive && effOn,\n      regelung: true,\n    };\n    // Zustandswechsel je Stufe mitschreiben, damit \"wird gerade aktiv\" und \"gerade abgeklungen\"\n    // farblich unterscheidbar sind — sonst sieht man nur an/aus und verpasst die Reihenfolge.\n    const nowMs = v.simMs || 0;\n    if (!v.stackPhase) v.stackPhase = {};\n    const FRESH_MS = 900;\n    const stackBlocks = STACK_DEFS.map((s) => {\n      const active = activeMap[s.key];\n      const ph = v.stackPhase[s.key] || (v.stackPhase[s.key] = { active, since: nowMs });\n      if (ph.active !== active) {\n        ph.active = active;\n        ph.since = nowMs;\n      }\n      const age = nowMs - ph.since;\n      const justOn = active && age < FRESH_MS;\n      const justOff = !active && age < FRESH_MS;\n      let status = active ? (justOn ? 'wird aktiv' : 'aktiv') : justOff ? 'abgeklungen' : 'inaktiv';\n      // Fehlerkaskade sichtbar machen: fällt die Sensorik aus, bekommen die nachgelagerten Stufen\n      // keine Daten mehr — sie sind nicht einfach \"inaktiv\", sondern ohne Eingang.\n      const starved = !effOn && s.key !== 'sensorik' && s.key !== 'regelung';\n      if (!effOn && s.key === 'sensorik') status = 'kein Signal';\n      if (starved) status = 'kein Input';\n      if (s.key === 'regelung' && v.braking) status = 'bremst';\n      else if (!effOn && s.key === 'regelung') status = 'fährt blind weiter';\n      const starvedTone = starved || (!effOn && s.key !== 'regelung');\n      // Farbschlüssel: türkis = springt gerade an, blau = läuft, violett = klingt ab,\n      // rot = ohne Eingang, grau = ruht.\n      const tone = starvedTone\n        ? { bg: 'oklch(95% 0.03 25)', border: 'oklch(70% 0.13 25)', fg: 'oklch(45% 0.17 25)', dot: 'oklch(55% 0.19 25)', lat: 'oklch(55% 0.13 25)' }\n        : justOn\n        ? { bg: 'oklch(93% 0.09 185)', border: 'oklch(58% 0.13 185)', fg: 'oklch(34% 0.09 195)', dot: 'oklch(60% 0.15 185)', lat: 'oklch(42% 0.08 195)' }\n        : active\n        ? { bg: 'oklch(93% 0.05 255)', border: 'oklch(55% 0.14 255)', fg: 'oklch(35% 0.12 255)', dot: 'oklch(55% 0.16 255)', lat: 'oklch(45% 0.1 255)' }\n        : justOff\n        ? { bg: 'oklch(96% 0.03 300)', border: 'oklch(78% 0.08 300)', fg: 'oklch(48% 0.11 300)', dot: 'oklch(62% 0.14 300)', lat: 'oklch(58% 0.08 300)' }\n        : { bg: 'oklch(97% 0.003 255)', border: 'oklch(87% 0.006 255)', fg: 'oklch(58% 0.01 255)', dot: 'oklch(80% 0.008 255)', lat: 'oklch(65% 0.01 255)' };\n      return {\n        ...s,\n        active,\n        status,\n        bg: tone.bg,\n        border: tone.border,\n        color: tone.fg,\n        dotColor: tone.dot,\n        anim: justOn ? 'stackFlash 0.9s ease-out 1' : active ? 'stackPulse 1.6s ease-out infinite' : 'none',\n        latencyText: starvedTone ? '—' : `${s.latency} ms`,\n        latencyColor: tone.lat,\n      };\n    });\n    const brakeBarHue = { trocken: 'oklch(55% 0.14 255)', nass: 'oklch(58% 0.15 85)', glatt: 'oklch(55% 0.19 25)' }[v.roadCondition];\n    const stackLegend = [      { label: 'springt an', color: 'oklch(60% 0.15 185)' },\n      { label: 'läuft', color: 'oklch(55% 0.16 255)' },\n      { label: 'klingt ab', color: 'oklch(62% 0.14 300)' },\n      { label: 'kein Eingang', color: 'oklch(55% 0.19 25)' },\n      { label: 'ruht', color: 'oklch(80% 0.008 255)' },\n    ];\n    const totalLatency = STACK_DEFS.reduce((a2, s) => a2 + s.latency, 0);\n    // Datenfluss: ein Token durchläuft die Kette in Echtzeit-Vielfachen der Stufen-Latenzen.\n    const FLOW_SCALE = 14;\n    const flowCycle = totalLatency * FLOW_SCALE;\n    const flowPos = effOn ? (v.flowMs || 0) % flowCycle : -1;\n    let flowAcc = 0;\n    let flowStage = -1;\n    let flowFrac = 0;\n    if (flowPos >= 0) {\n      for (let i = 0; i < STACK_DEFS.length; i++) {\n        const span = STACK_DEFS[i].latency * FLOW_SCALE;\n        if (flowPos < flowAcc + span) {\n          flowStage = i;\n          flowFrac = (flowPos - flowAcc) / span;\n          break;\n        }\n        flowAcc += span;\n      }\n    }\n    const stackBlocksFlow = stackBlocks.map((blk, i) => ({\n      ...blk,\n      hasToken: i === flowStage,\n      tokenAnim: `flowBlip ${Math.round(STACK_DEFS[i].latency * FLOW_SCALE)}ms ease-out forwards`,\n      tokenColor: 'oklch(55% 0.16 255)',\n    }));\n    const latencyMeters = ((v.curSpeed * 1000) / 3600) * (totalLatency / 1000);\n    const latencyNote = !effOn\n      ? 'Kein Sensoreingang — die Kette bricht an der ersten Stufe ab, nachgelagerte Module verarbeiten nichts. Die Regelung hält die letzte Sollvorgabe.'\n      : `Reaktionszeit ${totalLatency} ms — bei ${Math.round(v.curSpeed)} km/h legt das Fahrzeug in dieser Zeit ${latencyMeters.toFixed(1)} m zurück, bevor die Bremsung überhaupt einsetzt.`;\n\n    const sensorButtons = SENSOR_DEFS.map((s) => {\n      const on = v.sensors[s.key];\n      const effActive = on && !v.blackout;\n      return {\n        ...s,\n        on,\n        toggle: () => this.setSensor(key, s.key),\n        bg: on ? 'oklch(93% 0.05 255)' : '#ffffff',\n        border: on ? 'oklch(55% 0.14 255)' : 'oklch(87% 0.006 255)',\n        fg: on ? 'oklch(35% 0.12 255)' : 'oklch(50% 0.01 255)',\n        badge: v.blackout ? 'AUSFALL' : on ? 'AN' : 'AUS',\n        badgeBg: v.blackout ? 'oklch(55% 0.19 25)' : on ? 'oklch(55% 0.14 255)' : 'oklch(78% 0.01 255)',\n        stateText: effActive ? s.role : s.lost,\n        stateColor: effActive ? 'oklch(40% 0.1 255)' : 'oklch(45% 0.16 25)',\n      };\n    });\n\n    const typeButtons = OBJ_TYPES.map((t) => {\n      const sel = v.placeType === t.key;\n      return {\n        ...t,\n        choose: () => this.setPlaceType(key, t.key),\n        bg: sel ? 'oklch(48% 0.14 255)' : '#ffffff',\n        fg: sel ? '#ffffff' : 'oklch(35% 0.01 255)',\n        border: sel ? 'oklch(48% 0.14 255)' : 'oklch(87% 0.006 255)',\n      };\n    });\n\n    // Geplanter Pfad in 20-px-Schritten entlang der tatsächlichen Ideallinie abgetastet. Vorher\n    // war es eine Quadratik bis EGO_Y − 280 und danach EINE + (x - 6) + ',' + (ARROW_Y - 6) + ' ' + (x + 6) + ',' + (ARROW_Y - 6);\n    const arrowRightPts = arrowUp(LANE_DRIVE + curveOffsetAt(v, ARROW_Y));\n    const arrowLeftPts = oneWay\n      ? arrowUp(LANE_LEFT_CENTER + curveOffsetAt(v, ARROW_Y))\n      : arrowDown(LANE_LEFT_CENTER + curveOffsetAt(v, ARROW_Y));\n    const roadTypeLabel = oneWay\n      ? 'Richtungsfahrbahn — beide Spuren in dieselbe Richtung, links ist Überholspur'\n      : 'Landstraße — ein Fahrstreifen je Richtung, links kommt Gegenverkehr';\n    const camPts = sensorCone(v.egoX, EGO_Y, range.camera, 18);\n    const radarPts = sensorCone(v.egoX, EGO_Y, range.radar, 26);\n\n    // Haltelinie: an der Ampelkreuzung 16 px vor der Ampel/dem Zebrastreifen. An der Kreuzung\n    // ohne Ampel liegt die Querstraße als 60 px tiefes Band um intersectionY (also von −30 bis\n    // +30) — die Linie muss VOR deren nahem Rand liegen, aus Ego-Sicht also bei +36. Mit −16 lag\n    // sie 46 px INNERHALB der Kreuzung: das Fahrzeug hielt mitten auf der Fahrbahn des\n    // Querverkehrs und beide fuhren ineinander.\n    const stopLineY = v.crossActive ? v.intersectionY + 36 : v.intersectionY - 16;\n    const crossWalkY = v.intersectionY + 10;\n    const lightColorHex = { green: 'oklch(55% 0.16 145)', yellow: 'oklch(75% 0.16 85)', red: 'oklch(52% 0.19 25)' };\n    const LIGHT_DEFS = [\n      { key: 'green', label: 'Grün' },\n      { key: 'yellow', label: 'Gelb' },\n      { key: 'red', label: 'Rot' },\n    ];\n    // Ohne gezeichnete Ampel bleibt das Lichtsignal ohne Wirkung — die Schalter werden deshalb\n    // gesperrt, statt eine Reaktion zu versprechen, die das Szenario nicht hat.\n    const hasLightPhys = v.hasIntersection !== false && !v.crossActive;\n    const lightButtons = LIGHT_DEFS.map((l) => {\n      const sel = v.light === l.key;\n      return {\n        ...l,\n        choose: hasLightPhys ? () => this.setLight(key, l.key) : () => {},\n        cursor: hasLightPhys ? 'pointer' : 'not-allowed',\n        opacity: h     )\n        : null,\n      v.ticketTitle\n        ? T({ key: 'tt', x: 28, y: 577, fontSize: 11.5, fontWeight: 700, fill: 'oklch(40% 0.18 25)', fontFamily: FONT }, v.ticketTitle)\n        : null,\n      v.ticketTitle\n        ? T({ key: 't1', x: 28, y: 595, fontSize: 10.5, fill: 'oklch(40% 0.1 25)', fontFamily: FONT }, v.ticketText || '')\n        : null,\n      v.ticketTitle\n        ? T({ key: 't2', x: 28, y: 611, fontSize: 10.5, fill: 'oklch(40% 0.1 25)', fontFamily: FONT }, v.ticketText2 || '')\n        : null\n    );\n    const histPts = v.history.map((h, i) => `${(i / 79) * 150},${-Math.max(-20, Math.min(20, h * 10))}`).join(' ');\n\n    // -- Legende: zeigt nur, was in dieser Szene und bei dieser Sensorkonfiguration tatsächlich\n    // gezeichnet wird. Ein Lidar-Kreis in der Legende bei abgeschaltetem Lidar wäre Rauschen.\n    const LG_KINDS = ['isCone', 'isRing', 'isBar', 'isDash', 'isSign', 'isCam', 'isArrow', 'isZone', 'isBox', 'isLight'];\n    const lgItem = (kind, label, desc, fill, stroke) => {\n      const e = { label, desc, fill: fill || 'none', stroke: stroke || 'oklch(50% 0.01 255)' };\n      LG_KINDS.forEach((k) => { e[k] = false; });\n      e[kind] = true;\n      return e;\n    };\n    const anyMoving = v.obstacles.some((o) => o.vx || o.pace);\n    const anyObstacle = v.obstacles.length > 0;\n    const sensorBlind = v.blackout || (!v.sensors.camera && !v.sensors.lidar && !v.sensors.radar);\n    const camOn = v.sensors.camera && !v.blackout;\n    const radarOn = v.sensors.radar && !v.blackout;\n    const lidarOn = v.sensors.lidar && !v.blackout;\n    const hasCrossing = v.hasIntersection !== false && !v.crossActive;\n    const sceneLegend = [];\n    if (sensorBlind) {\n      sceneLegend.push(lgItem('isZone', 'Keine Sensordaten', 'Alle Sensoren aus oder Blackout — die Szene wird nicht mehr erfasst', 'oklch(60% 0.18 25 / 0.15)', 'oklch(50% 0.18 25)'));\n    }\n    if (camOn) sceneLegend.push(lgItem('isCone', 'Kamerakegel', 'Klassifikation, Ampelfarbe, Schilder — schmal, reicht ' + Math.round(range.camera / pxPerMD) + ' m', 'oklch(75% 0.15 80 / 0.35)', 'oklch(58% 0.15 80)'));\n    if (radarOn) sceneLegend.push(lgItem('isCone', 'Radarkegel', 'Relativgeschwindigkeit — weit (' + Math.round(range.radar / pxPerMD) + ' m), aber grob', 'oklch(65% 0.15 145 / 0.3)', 'oklch(50% 0.15 145)'));\n    if (lidarOn) sceneLegend.push(lgItem('isRing', 'Lidar-Kreis', 'Exakte Distanz rundum, kurze Reichweite (' + Math.round(range.lidar / pxPerMD) + ' m)', 'oklch(60% 0.14 255 / 0.14)', 'oklch(55% 0.14 255)'));\n    sceneLegend.push(lgItem('isBar', 'Bremswegbalken', 'Strecke bis Stillstand — wächst mit Tempo und Reibwert (' + v.roadCondition + ')', brakeBarHue, brakeBarHue));\n    sceneLegend.push(lgItem('isDash', 'Geplanter Pfad', 'Trajektorie, die die Planung gerade ausgibt', 'none', 'oklch(45% 0.15 255)'));\n    if (radarOn && anyMoving) sceneLegend.push(lgItem('isDash', 'Prädiktionslinie', 'Erwartete Position eines bewegten Objekts — braucht Radar', 'none', 'oklch(52% 0.16 300)'));\n    if (anyObstacle) {\n      sceneLegend.push(lgItem('isBox', 'Grüne Umrandung', 'Objekt ist erkannt und wird verfolgt', 'oklch(70% 0.13 70)', 'oklch(42% 0.15 145)'));\n      sceneLegend.push(lgItem('isBox', 'Rote Umrandung', 'Objekt ist physisch da, aber vom Stack nicht erfasst', 'oklch(70% 0.13 70)', 'oklch(42% 0.18 25)'));\n    }\n    if ((v.signs || []).length) sceneLegend.push(lgItem('isSign', 'Tempolimit-Schild', 'Nur die Kamera liest es — ohne Kamera bleibt der alte Sollwert stehen', '#ffffff', 'oklch(52% 0.19 25)'));\n    if ((v.speedCams || []).length) sceneLegend.push(lgItem('isCam', 'Blitzer', 'Misst beim Passieren die Ist-Geschwindigkeit gegen das geltende Limit', 'oklch(35% 0.02 255)', 'oklch(25% 0.02 255)'));\n    if (v.laneChangeActive && oneWay) sceneLegend.push(lgItem('isZone', 'Toter Winkel', 'Bereich neben dem Fahrzeug, den Kamera und Radar nicht abdecken — nur Lidar sieht hinein', 'oklch(60% 0.18 25 / 0.14)', 'oklch(50% 0.16 25)'));\n    if (v.obstacles.some((o) => o.type === 'parkfahrzeug')) sceneLegend.push(lgItem('isZone', 'Verdeckungsschatten', 'Bereich hinter dem parkenden Fahrzeug, in den von der Fahrzeugposition aus kein Sensor hineinsieht. Rot, solange dort ein Objekt steht — keine Sensor-Redundanz hilft dagegen.', 'oklch(52% 0.17 25 / 0.16)', 'oklch(52% 0.17 25)'));\n    if (v.obstacles.some((o) => o.oncoming)) sceneLegend.push(lgItem('isArrow', 'Gegenverkehr', 'Fahrzeug auf der Gegenspur, Pfeil zeigt seine Fahrtrichtung', '#ffffff', 'oklch(45% 0.02 255)'));\n    if (v.stopSign) sceneLegend.push(lgItem('isSign', 'Stoppschild', signRead ? 'Von der Kamera gelesen → Pflichthalt an der Haltelinie, dann Vorfahrt prüfen' : 'Noch nicht gelesen (grau) — ohne Kamera bleibt der Pflichthalt aus', signRead ? 'oklch(52% 0.19 25)' : 'oklch(78% 0.01 255)', signRead ? 'oklch(38% 0.16 25)' : 'oklch(55% 0.01 255)'));\n    if (v.crossActive) sceneLegend.push(lgItem('isArrow', 'Querverkehr von rechts', 'Hat Vorfahrt — die Planung muss ohne Ampelsignal entscheiden', '#ffffff', 'oklch(45% 0.02 255)'));\n    if (hasCrossing) sceneLegend.push(lgItem('isLight', 'Ampel, Haltelinie, Zebrastreifen', 'Haltepunkt der Kreuzung; die Ampelfarbe stellst du links ein', lightColorHex[v.light], 'oklch(35% 0.02 255)'));\n    if (v.curveActive) sceneLegend.push(lgItem('isDash', 'Kurvenverlauf', 'Die Planung senkt das Solltempo vor der Krümmung', 'none', 'oklch(50% 0.14 300)'));\n    sceneLegend.push(lgItem('isArrow', 'Fahrtrichtungspfeile', oneWay\n      ? 'Beide Pfeile nach oben: Richtungsfahrbahn, links ist Überholspur'\n      : 'Gegenläufige Pfeile: ein Fahrstreifen je Richtung, links kommt Gegenverkehr', '#ffffff', 'oklch(55% 0.02 255)'));\n\n    return {\n      obstaclesDisp,\n      shadowsDisp,\n      shadowColor,\n      egoX: v.egoX,\n      egoY: EGO_Y,\n      egoRectX: v.egoX - 18,\n      egoTransform: 'rotate(' + (v.yaw ?? 0).toFixed(2) + ' ' + v.egoX.toFixed(1) + ' ' + (EGO_Y + 3) + ')',\n      brakeBarY: brakeTop,\n      brakeBarH: brakeHeight,\n      brakeClipped,\n      brakeArrowPts: (v.egoX - 13) + ',22 ' + (v.egoX + 13) + ',22 ' + v.egoX + ',8',\n      brakeBarX: v.egoX - 13,\n      brakeBarColor: { trocken: 'oklch(55% 0.14 255)', nass: 'oklch(58% 0.15 85)', glatt: 'oklch(55% 0.19 25)' }[v.roadCondition],\n      brakeBarLabel: brakeLabelText,\n      brakeBarLabelY: brakeClipped ? 34 : brakeTop - 6,\n      pathD,\n      camPts,\n      radarPts,\n      lidarR: range.lidar,\n      sensors: v.blackout ? { camera: false, lidar: false, radar: false } : v.sensors,\n      sensorButtons,\n      typeButtons,\n      speed: v.speed,\n      ttcDisplay: v.ttc === Infinity ? '∞' : v.ttc.toFixed(1) + ' s',\n      ttcColor,\n      querfehlerDisplay: v.querfehler.toFixed(2) + ' m',\n      qColor,\n      steerDisplay: v.steering.toFixed(1) + ' px/s',\n      collided: v.collided,\n      blackout: v.blackout,\n      blackoutLabel: v.blackout ? 'Sensorausfall beheben' : 'Sensorausfall simulieren',\n      blackoutBg: v.blackout ? 'oklch(95% 0.04 25)' : '#ffffff',\n      blackoutBorder: v.blackout ? 'oklch(50% 0.18 25)' : 'oklch(87% 0.006 255)',\n      blackoutFg: v.blackout ? 'oklch(42% 0.18 25)' : 'oklch(35% 0.01 255)',\n      stackBlocks: stackBlocksFlow,\n      flowNote: effOn\n        ? 'Der Punkt leuchtet in der Stufe auf, die einen Messwert gerade verarbeitet, und erlischt beim Weiterreichen — die Verweildauer je Stufe entspricht ihrer Latenz.'\n        : 'Kein Datenfluss — ohne Sensoreingang bleibt die Kette leer.',\n      scenarioButtons: SCENARIO_DEFS.map((sc) => {\n        const sel = v.scenario === sc.key;\n        return {\n          ...sc,\n          choose: () => this.applyScenario(key, sc.key),\n          bg: sel ? 'oklch(30% 0.06 255)' : '#ffffff',\n          fg: sel ? '#ffffff' : 'oklch(35% 0.01 255)',\n          border: sel ? 'oklch(30% 0.06 255)' : 'oklch(87% 0.006 255)',\n          weight: sel ? '700' : '500',\n        };\n      }),\n      scenarioHint: (SCENARIO_DEFS.find((sc) => sc.key === v.scenario) || {}).hint || '',\n      stackLegend,\n      // Zeiger innerhalb der Bahn halten: die reine Prozentangabe setzte ihn am Anschlag mit halber\n      // Breite über den rechten Rand hinaus.\n      steerGaugeLeft: `calc(5px + (100% - 10px) * ${(0.5 + Math.max(-1, Math.min(1, v.steering / MAX_STEER)) * 0.5).toFixed(4)})`,\n      steerGaugeColor: Math.abs(v.steering) > MAX_STEER * 0.6 ? 'oklch(55% 0.18 25)' : Math.abs(v.steering) > MAX_STEER * 0.25 ? 'oklch(58% 0.15 80)' : 'oklch(55% 0.16 255)',\n      openTipSpeed: () => this.setTip('speed'),\n      openTipTtc: () => this.setTip('ttc'),\n      openTipQuer: () => this.setTip('quer'),\n      openTipSteer: () => this.setTip('steer'),\n      tipSpeed: 'Ist-Geschwindigkeit des Fahrzeugs in km/h. Sie folgt der Sollvorgabe über die Längsregelung, begrenzt durch die maximale Verzögerung a = μ · g.',\n      tipTtc: 'Time to Collision in Sekunden: TTC = Abstand / Relativgeschwindigkeit. Unter 2 s gilt die Situation als kritisch.',\n      tipQuer: 'Regelgröße bzw. Regelfehler e der Querregelung, in Metern: e = x_soll − x_ist, also der seitliche Abstand zwischen geplantem Pfad und Fahrzeugmitte. 0 bedeutet: das Fahrzeug liegt genau auf dem geplanten Pfad — auch bei einem gewollten Spur-Offset.',\n      tipSteer: 'Stellgröße u — der Ausgang des P-Reglers, nicht die Regelgröße (das ist der Querfehler e): u = Kp · e mit e in Pixeln (quer gilt 1 m = ' + PX_PER_M + ' px) und Kp = 2,4 — bezogen auf e in Metern also u = 96 · e. Ergebnis ist die seitliche Korrekturrate in px/s, im Betrag auf ±' + MAX_STEER + ' px/s und in der Änderungsrate auf 260 px/s² begrenzt (Lenkdynamik). Der Zeiger zeigt die Auslastung dieser Grenze.',\n      sceneLegend,\n      latencyNote,\n      paused: v.paused,\n      pauseLabel: v.paused ? 'Weiter' : 'Pause',\n      pauseBg: v.paused ? 'oklch(48% 0.14 255)' : '#ffffff',\n      pauseFg: v.paused ? '#ffffff' : 'oklch(35% 0.01 255)',\n      pauseBorder: v.paused ? 'oklch(48% 0.14 255)' : 'oklch(87% 0.006 255)',\n      accuracyNote: v.rangeAccuracy && v.rangeAccuracy < 1\n        ? 'Ohne Lidar: Distanz nur geschätzt → Bremsbeginn ca. 30 % später'\n        : '',\n      oddText,\n      oddColor,\n      oddBg,\n      histPts,\n      signsDisp,\n      camsDisp,\n      sceneLabels,\n      flashOn,\n      limitHudVisible,\n      limitHudText: v.knownLimit ? String(v.knownLimit) : '?',\n      limitHudColor: v.knownLimit ? 'oklch(25% 0.01 255)' : 'oklch(45% 0.18 25)',\n      limitHudTooltip: v.knownLimit\n        ? 'Von der Kamera gelesenes Tempolimit: ' + v.knownLimit + ' km/h — begrenzt den Sollwert'\n        : 'Kein Tempolimit gelesen — der Sollwert des Reglers gilt unverändert',\n      ticketTitle: v.ticketTitle || '',\n      ticketText: v.ticketText || '',\n      ticketText2: v.ticketText2 || '',\n      obstacleCount: v.obstacles.length,\n      curSpeed: Math.round(v.curSpeed),\n      roadDashOffset: -v.roadOffset,\n      roadPolyD,\n      centerLineD,\n      idealLineD,\n      edgeLeftD,\n      edgeRightD,\n      arrowLeftPts,\n      arrowRightPts,\n      roadTypeLabel,\n      blindSpotVisible: v.laneChangeActive && oneWay,\n      laneSectionLabel: v.overtakeActive ? '4 · Überholen' : '4 · Spurwechsel',\n      roadFeaturesVisible: v.hasIntersection !== false && !v.curveActive && !v.crossActive,\n      curveActive: v.curveActive,\n      crossActive: v.crossActive,\n      crossVehicleX: v.crossVehicle.x - 16,\n      crossVehicleY: v.intersectionY - 9,\n      crossVehicleOutline: v.crossDetected ? 'oklch(42% 0.15 145)' : 'oklch(42% 0.18 25)',\n      sideRoadY: v.intersectionY - 30,\n      ampelDisplay: v.crossActive || v.hasIntersection === false ? 'none' : 'inline',\n      lightButtons,\n      roadCondButtons,\n      roadCondText,\n      lightColor: lightColorHex[v.light],\n      lightDimGreen: v.light === 'green' ? lightColorHex.green : 'oklch(88% 0.02 145)',\n      lightDimYellow: v.light === 'yellow' ? lightColorHex.yellow : 'oklch(90% 0.02 85)',\n      lightDimRed: v.light === 'red' ? lightColorHex.red : 'oklch(90% 0.02 25)',\n      poleY: v.intersectionY,\n      poleLampTop: v.intersectionY - 94,\n      redCy: v.intersectionY - 84,\n      yellowCy: v.intersectionY - 67,\n      greenCy: v.intersectionY - 50,\n      stopLineY,\n      crossWalkY,\n      crosswalkStripes,\n      stopSignVisible: !!v.stopSign,\n      stopSignPts,\n      stopPoleY: stopSignCy + 8,\n      stopSignTextY: stopSignCy + 3.5,\n      stopSignFill: signRead ? 'oklch(52% 0.19 25)' : 'oklch(78% 0.01 255)',\n      stopSignStroke: signRead ? 'oklch(38% 0.16 25)' : 'oklch(55% 0.01 255)',\n      stopSignTextColor: signRead ? '#ffffff' : 'oklch(40% 0.01 255)',\n      stopSignTooltip,\n      ampelStatusText,\n      ampelStatusColor,\n      ampelStatusBg,\n      lightTooltip,\n      causalText: stableCausal.text,\n      causalColor: stableCausal.color,\n      causalBg: stableCausal.bg,\n      laneChangeActive: v.laneChangeActive,\n      blindZoneColor: v.blindSpotOccupied ? (v.blindSpotDetected ? 'oklch(50% 0.15 145)' : 'oklch(52% 0.19 25)') : 'oklch(60% 0.02 255)',\n      laneChangeMsg: v.laneChangeMsg,\n      laneChangeColor:\n        v.laneChangeState === 'crash' || v.laneChangeState === 'blocked'\n          ? 'oklch(45% 0.17 25)'\n          : v.laneChangeState === 'moving' && v.blindSpotOccupied && !v.blindSpotDetected\n          ? 'oklch(48% 0.15 60)'\n          : 'oklch(40% 0.12 255)',\n      laneChangeBtnLabel: v.overtakeActive\n        ? v.laneTargetX === LANE_LEFT_CENTER\n          ? 'Überholvorgang beenden'\n          : 'Überholvorgang anfordern'\n        : v.laneTargetX === LANE_LEFT_CENTER\n        ? 'Zurück nach rechts'\n        : 'Spurwechsel nach links anfordern',\n      blindSpotText: v.overtakeActive\n        ? oncStatusText\n        : v.blindSpotOccupied\n        ? v.blindSpotDetected\n          ? 'Toter Winkel belegt — vom Lidar erfasst'\n          : 'Toter Winkel belegt — von keinem aktiven Sensor erfasst'\n        : 'Toter Winkel frei',\n      blindSpotColor: v.overtakeActive\n        ? oncStatusColor\n        : v.blindSpotOccupied\n        ? v.blindSpotDetected\n          ? 'oklch(42% 0.13 145)'\n          : 'oklch(45% 0.17 25)'\n        : 'oklch(50% 0.01 255)',\n      requestLaneChange: () => this.requestLaneChange(key),\n      onSceneClick: (e) => this.onSceneClick(key, e),\n      removeObstacle: (id) => this.removeObstacle(key, id),\n      clearObstacles: () => this.clearObstacles(key),\n      resetSim: () => this.resetVariant(key),\n      timeScaleButtons: TIME_SCALES.map((t) => {\n        const sel = (v.timeScale ?? 1) === t.val;\n        return {\n          ...t,\n          choose: () => this.setTimeScale(key, t.val),\n          bg: sel ? 'oklch(48% 0.14 255)' : 'oklch(34% 0.02 255)',\n          border: sel ? 'oklch(48% 0.14 255)' : 'oklch(42% 0.02 255)',\n          fg: sel ? '#ffffff' : 'oklch(88% 0.005 255)',\n        };\n      }),\n      togglePause: () => this.togglePause(key),\n      singleStep: () => this.singleStep(key),\n      toggleBlackout: () => this.toggleBlackout(key),\n      setSpeedVal: (e) => this.setSpeed(key, Number(e.target.value)),\n    };\n  }\n\n  renderVals() {\n    return {\n      b: this.buildDisplay('b'),\n      showGlossary: this.state.showGlossary,\n      toggleGlossary: this.toggleGlossary,\n      glossaryTerms: GLOSSARY,\n      glossaryLabel: this.state.showGlossary ? 'Glossar ausblenden' : 'Glossar anzeigen',\n      tipTitle: (TIP_TEXTS[this.state.openTip] || [])[0] || '',\n      tipBody: (TIP_TEXTS[this.state.openTip] || [])[1] || '',\n      closeTip: () => this.setState((st) => ({ ...st, openTip: null })),\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
